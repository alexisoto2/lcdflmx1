<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro | La Casa de los Famosos Roblox</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            padding: 25px 15px;

            color: #fff;

            background:
                radial-gradient(circle at 12% 12%, rgba(0, 220, 255, .75), transparent 30%),
                radial-gradient(circle at 88% 10%, rgba(172, 91, 255, .75), transparent 33%),
                radial-gradient(circle at 50% 90%, rgba(255, 153, 220, .65), transparent 38%),
                linear-gradient(135deg, #063d50, #292b88 48%, #7337a7);

            background-attachment: fixed;

            overflow-x: hidden;
        }

        /* NUBES / LUCES DEL FONDO */

        body::before,
        body::after {
            content: "";
            position: fixed;
            z-index: -1;

            border-radius: 50%;

            filter: blur(90px);

            pointer-events: none;
        }

        body::before {
            width: 420px;
            height: 420px;

            top: -180px;
            left: -130px;

            background: rgba(72, 225, 255, .35);
        }

        body::after {
            width: 520px;
            height: 520px;

            right: -190px;
            bottom: -220px;

            background: rgba(230, 137, 255, .35);
        }

        /* CONTENEDOR */

        .container {
            width: 100%;
            max-width: 650px;

            margin: 0 auto;

            padding: 30px 25px 35px;

            background: rgba(255, 255, 255, .11);

            border: 1px solid rgba(255, 255, 255, .28);

            border-radius: 32px;

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, .35),
                inset 0 1px 2px rgba(255, 255, 255, .35);
        }

        /* LOGO */

        .logo-container {
            display: flex;
            justify-content: center;

            margin-bottom: 15px;
        }

        .logo-box {
            width: min(390px, 100%);
            min-height: 155px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 12px;

            border-radius: 28px;

            background: rgba(255, 255, 255, .10);

            border: 1px solid rgba(255, 255, 255, .25);

            backdrop-filter: blur(15px);

            box-shadow:
                0 15px 40px rgba(0, 0, 0, .25),
                inset 0 1px 2px rgba(255, 255, 255, .3);
        }

        .logo-img {
            width: 100%;
            max-width: 360px;
            max-height: 165px;

            object-fit: contain;

            filter:
                drop-shadow(0 10px 12px rgba(0, 0, 0, .35))
                drop-shadow(0 0 25px rgba(0, 190, 255, .35));

            transition: transform .3s ease;
        }

        .logo-img:hover {
            transform: scale(1.035);
        }

        /* ENCABEZADO */

        .header {
            text-align: center;

            margin-bottom: 28px;
        }

        .header h1 {
            margin-top: 18px;
            margin-bottom: 8px;

            font-size: clamp(1.6rem, 5vw, 2.35rem);

            font-weight: 1000;

            text-transform: uppercase;

            letter-spacing: 1.5px;

            text-shadow:
                0 3px 0 #1556c5,
                0 7px 15px rgba(0, 0, 0, .45);
        }

        .header p {
            color: rgba(255, 255, 255, .78);

            font-size: .92rem;

            line-height: 1.5;
        }

        .tag {
            display: inline-block;

            margin-top: 12px;

            padding: 6px 14px;

            border-radius: 30px;

            background: rgba(255, 255, 255, .13);

            border: 1px solid rgba(255, 255, 255, .25);

            color: #dff8ff;

            font-size: .72rem;

            font-weight: 800;

            letter-spacing: 1px;

            text-transform: uppercase;
        }

        /* FORMULARIO */

        form {
            width: 100%;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: rgba(255, 255, 255, .88);

            font-size: .84rem;

            font-weight: 700;
        }

        .required {
            color: #7ddcff;
        }

        input[type="text"],
        input[type="number"],
        input[type="email"],
        input[type="tel"],
        textarea {
            width: 100%;

            padding: 14px 15px;

            border-radius: 14px;

            border: 1px solid rgba(255, 255, 255, .22);

            background: rgba(5, 15, 45, .32);

            color: #fff;

            font-size: .95rem;

            outline: none;

            transition:
                border-color .25s ease,
                background .25s ease,
                box-shadow .25s ease,
                transform .2s ease;
        }

        input::placeholder,
        textarea::placeholder {
            color: rgba(255, 255, 255, .38);
        }

        input:focus,
        textarea:focus {
            border-color: #54d9ff;

            background: rgba(5, 15, 45, .45);

            box-shadow:
                0 0 0 3px rgba(84, 217, 255, .10),
                0 0 18px rgba(84, 217, 255, .12);

            transform: translateY(-1px);
        }

        textarea {
            min-height: 120px;

            resize: vertical;

            line-height: 1.5;
        }

        /* BOTÓN */

        .btn {
            display: block;

            width: 100%;

            padding: 14px 20px;

            border-radius: 14px;

            border: none;

            font-size: .96rem;

            font-weight: 900;

            text-decoration: none;

            text-align: center;

            cursor: pointer;

            transition: .25s ease;
        }

        .btn-primary {
            margin-top: 10px;

            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #078fff,
                    #513cff,
                    #a53dff
                );

            box-shadow:
                0 8px 25px rgba(47, 102, 255, .40),
                inset 0 1px 1px rgba(255, 255, 255, .45);
        }

        .btn-primary:hover {
            transform: translateY(-2px) scale(1.01);

            box-shadow:
                0 12px 30px rgba(79, 83, 255, .55),
                0 0 25px rgba(57, 195, 255, .20);
        }

        .btn-primary:active {
            transform: scale(.98);
        }

        .btn-primary:disabled {
            opacity: .65;

            cursor: wait;

            transform: none;
        }

        .btn-link {
            margin-top: 10px;

            color: rgba(255, 255, 255, .65);

            background: rgba(255, 255, 255, .06);

            border: 1px solid rgba(255, 255, 255, .12);
        }

        .btn-link:hover {
            color: #fff;

            background: rgba(255, 255, 255, .12);
        }

        /* AVISO */

        .info-box {
            margin-bottom: 24px;

            padding: 15px 17px;

            border-radius: 17px;

            text-align: left;

            background:
                linear-gradient(
                    135deg,
                    rgba(0, 170, 255, .12),
                    rgba(159, 74, 255, .13)
                );

            border: 1px solid rgba(255, 255, 255, .18);
        }

        .info-box strong {
            display: block;

            margin-bottom: 4px;

            color: #fff;

            font-size: .9rem;
        }

        .info-box span {
            color: rgba(255, 255, 255, .68);

            font-size: .78rem;

            line-height: 1.4;
        }

        /* MODAL */

        .modal {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            padding: 20px;

            display: flex;

            justify-content: center;
            align-items: center;

            background: rgba(2, 5, 25, .78);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            z-index: 1000;
        }

        .hidden {
            display: none !important;
        }

        .modal-body {
            width: 100%;
            max-width: 430px;

            padding: 30px 22px;

            text-align: center;

            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    rgba(35, 48, 125, .95),
                    rgba(72, 39, 120, .95)
                );

            border: 1px solid rgba(255, 255, 255, .25);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, .55),
                inset 0 1px 2px rgba(255, 255, 255, .25);

            animation: aparecer .25s ease;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: scale(.92) translateY(10px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .result-card {
            text-align: center;
        }

        .selected-badge {
            display: inline-block;

            margin-bottom: 12px;

            padding: 6px 12px;

            border-radius: 20px;

            background: rgba(16, 185, 129, .18);

            border: 1px solid rgba(52, 211, 153, .4);

            color: #6ee7b7;

            font-size: .7rem;

            font-weight: 900;

            letter-spacing: 1px;
        }

        .welcome-icon {
            font-size: 3rem;

            margin-bottom: 10px;
        }

        .result-card h2 {
            margin-bottom: 10px;

            font-size: 1.5rem;
        }

        .result-card p {
            color: rgba(255, 255, 255, .72);

            font-size: .87rem;

            line-height: 1.5;
        }

        .folio-box {
            margin: 18px 0;

            padding: 14px;

            border-radius: 14px;

            background: rgba(0, 0, 0, .25);

            border: 1px dashed #5bdcff;

            color: #62dcff;

            font-size: 1.4rem;

            font-weight: 1000;

            letter-spacing: 2px;

            word-break: break-word;

            text-shadow: 0 0 12px rgba(98, 220, 255, .3);
        }

        .message.error h3 {
            margin-bottom: 10px;

            color: #ff7c9b;

            font-size: 1.3rem;
        }

        .message.error p {
            margin-bottom: 18px;

            color: rgba(255, 255, 255, .72);

            font-size: .88rem;

            line-height: 1.5;
        }

        /* FOOTER */

        footer {
            margin-top: 25px;

            text-align: center;

            color: rgba(255, 255, 255, .42);

            font-size: .72rem;
        }

        /* CELULAR */

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .container {
                padding: 23px 17px 28px;

                border-radius: 27px;
            }

            .logo-box {
                min-height: 135px;
            }

            .logo-img {
                max-height: 135px;
            }

            .header h1 {
                font-size: 1.65rem;
            }

            input[type="text"],
            input[type="number"],
            input[type="email"],
            input[type="tel"],
            textarea {
                padding: 13px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- =========================
             LOGO
        ========================== -->

        <div class="logo-container">

            <div class="logo-box">

                <img
                    src="logo.png"
                    alt="La Casa de los Famosos Roblox"
                    class="logo-img"
                >

            </div>

        </div>


        <!-- =========================
             ENCABEZADO
        ========================== -->

        <header class="header">

            <h1>
                Formulario de Postulación
            </h1>

            <p>
                Completa tus datos para solicitar tu ingreso
                a La Casa de los Famosos Roblox.
            </p>

            <span class="tag">
                🏠 Temporada 2026
            </span>

        </header>


        <!-- =========================
             AVISO
        ========================== -->

        <div class="info-box">

            <strong>
                ✨ Completa todos tus datos
            </strong>

            <span>
                Revisa que tu información sea correcta antes
                de enviar tu solicitud.
            </span>

        </div>


        <!-- =========================
             FORMULARIO
        ========================== -->

        <form id="formSolicitud">

            <!-- NOMBRE -->

            <div class="form-group">

                <label for="nombre">
                    Nombre Completo
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Escribe tu nombre completo"
                    autocomplete="name"
                    required
                >

            </div>


            <!-- ROBLOX -->

            <div class="form-group">

                <label for="roblox">
                    Usuario de Roblox
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="roblox"
                    name="roblox"
                    placeholder="Ej. RobloxPlayer123"
                    autocomplete="off"
                    required
                >

            </div>


            <!-- EDAD -->

            <div class="form-group">

                <label for="edad">
                    Edad
                    <span class="required">*</span>
                </label>

                <input
                    type="number"
                    id="edad"
                    name="edad"
                    placeholder="Escribe tu edad"
                    min="1"
                    max="100"
                    required
                >

            </div>


            <!-- CORREO -->

            <div class="form-group">

                <label for="correo">
                    Correo Electrónico
                    <span class="required">*</span>
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="ejemplo@correo.com"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- TELEFONO -->

            <div class="form-group">

                <label for="telefono">
                    Teléfono
                    <span class="required">*</span>
                </label>

                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    placeholder="Tu número de teléfono"
                    autocomplete="tel"
                    required
                >

            </div>


            <!-- MOTIVO -->

            <div class="form-group">

                <label for="motivo">
                    ¿Por qué deberías entrar?
                    <span class="required">*</span>
                </label>

                <textarea
                    id="motivo"
                    name="motivo"
                    rows="5"
                    placeholder="Cuéntanos por qué quieres formar parte de la casa..."
                    required
                ></textarea>

            </div>


            <!-- BOTÓN -->

            <button
                type="submit"
                class="btn btn-primary"
            >
                🚀 ENVIAR SOLICITUD
            </button>


            <!-- VOLVER -->

            <a
                href="index.html"
                class="btn btn-link"
            >
                ← Volver al inicio
            </a>

        </form>


        <footer>
            © 2026 La Casa de los Famosos Roblox
        </footer>

    </main>


    <!-- =========================
         MODAL
    ========================== -->

    <div
        id="modal"
        class="modal hidden"
    >

        <div
            id="modalContenido"
            class="modal-body"
        ></div>

    </div>


    <script>

        /* ==========================================
           APPS SCRIPT ORIGINAL DE REGISTRO
           ========================================== */

        const APPS_SCRIPT_URL =
            "https://script.google.com/macros/s/AKfycbxpYRNTRTROKznUfepJqJdvVQnLDx2K8TVret7AIUokaE6AEr4_Vxw0gH9AkTeuYe8m/exec";


        /* ==========================================
           SEGURIDAD PARA MOSTRAR TEXTO
           ========================================== */

        function escapar(texto) {

            if (!texto) return "";

            return String(texto)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* ==========================================
           LLAMAR AL APPS SCRIPT
           ========================================== */

        function llamarAPI(
            accion,
            parametros = {}
        ) {

            return new Promise((resolve, reject) => {

                const callbackName =
                    "jsonp_cb_" +
                    Math.random()
                        .toString(36)
                        .substring(2, 15);


                const urlParams =
                    new URLSearchParams({

                        action: accion,

                        callback: callbackName,

                        ...parametros

                    });


                const script =
                    document.createElement("script");


                script.src =
                    `${APPS_SCRIPT_URL}?${urlParams.toString()}`;


                window[callbackName] =
                    function(respuesta) {

                        cleanup();


                        if (
                            respuesta &&
                            respuesta.success
                        ) {

                            resolve(respuesta);

                        } else {

                            reject(
                                new Error(
                                    respuesta?.message ||
                                    "Error al procesar la solicitud."
                                )
                            );

                        }

                    };


                script.onerror =
                    function() {

                        cleanup();

                        reject(
                            new Error(
                                "Error de conexión con el servidor."
                            )
                        );

                    };


                function cleanup() {

                    delete window[callbackName];


                    if (script.parentNode) {

                        script.parentNode
                            .removeChild(script);

                    }

                }


                document.body.appendChild(script);

            });

        }


        /* ==========================================
           ABRIR MODAL
           ========================================== */

        function abrirModal(contenidoHtml) {

            const modal =
                document.getElementById("modal");

            const modalContenido =
                document.getElementById("modalContenido");


            if (
                modal &&
                modalContenido
            ) {

                modalContenido.innerHTML =
                    contenidoHtml;

                modal.classList.remove("hidden");

            }

        }


        /* ==========================================
           CERRAR MODAL
           ========================================== */

        function cerrarModal() {

            document
                .getElementById("modal")
                ?.classList
                .add("hidden");

        }


        /* ==========================================
           FORMULARIO
           ========================================== */

        document
            .getElementById("formSolicitud")
            ?.addEventListener(
                "submit",
                async function(e) {

                    e.preventDefault();


                    const form = e.target;


                    const submitBtn =
                        form.querySelector(
                            'button[type="submit"]'
                        );


                    const originalBtnText =
                        submitBtn.innerHTML;


                    const formData =
                        new FormData(form);


                    const datos = {

                        nombre:
                            formData.get("nombre"),

                        roblox:
                            formData.get("roblox"),

                        edad:
                            formData.get("edad"),

                        correo:
                            formData.get("correo"),

                        telefono:
                            formData.get("telefono"),

                        motivo:
                            formData.get("motivo")

                    };


                    try {

                        submitBtn.disabled = true;

                        submitBtn.innerHTML =
                            "⏳ ENVIANDO SOLICITUD...";


                        const respuesta =
                            await llamarAPI(
                                "guardarSolicitud",
                                datos
                            );


                        /* ==========================
                           REGISTRO EXITOSO
                           ========================== */

                        abrirModal(`

                            <div class="result-card">

                                <span class="selected-badge">
                                    ✓ REGISTRO EXITOSO
                                </span>

                                <div class="welcome-icon">
                                    🎉
                                </div>

                                <h2>
                                    ¡Solicitud Recibida!
                                </h2>

                                <p>
                                    Tu solicitud fue enviada correctamente.
                                </p>

                                <p style="margin-top:8px;">
                                    Guarda tu folio para consultar
                                    posteriormente tu estado.
                                </p>

                                <div class="folio-box">
                                    ${escapar(respuesta.folio)}
                                </div>

                                <a
                                    href="consulta.html?folio=${encodeURIComponent(respuesta.folio)}"
                                    class="btn btn-primary"
                                >
                                    🔍 CONSULTAR MI FOLIO
                                </a>

                            </div>

                        `);


                        form.reset();


                    } catch(error) {

                        /* ==========================
                           ERROR
                           ========================== */

                        abrirModal(`

                            <div class="message error">

                                <div class="welcome-icon">
                                    ⚠️
                                </div>

                                <h3>
                                    Error al registrar
                                </h3>

                                <p>
                                    ${escapar(error.message)}
                                </p>

                                <button
                                    class="btn btn-primary"
                                    onclick="cerrarModal()"
                                >
                                    CERRAR
                                </button>

                            </div>

                        `);

                    } finally {

                        submitBtn.disabled = false;

                        submitBtn.innerHTML =
                            originalBtnText;

                    }

                }
            );


        /* ==========================================
           CERRAR MODAL AL HACER CLICK FUERA
           ========================================== */

        document
            .getElementById("modal")
            ?.addEventListener(
                "click",
                function(e) {

                    if (
                        e.target === this
                    ) {

                        cerrarModal();

                    }

                }
            );

    </script>

</body>
</html>
