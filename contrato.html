<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrato Oficial - LCDLF Roblox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #2e1065, #0f051d);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .logo-container {
            margin-bottom: 15px;
        }

        .logo-img {
            max-width: 260px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 8px 16px rgba(0, 162, 255, 0.4));
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #ffffff;
        }

        p.desc {
            font-size: 0.88rem;
            color: #cbd5e1;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            transition: background 0.2s ease, transform 0.1s ease;
            box-sizing: border-box;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
            margin-bottom: 12px;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #0369a1, #0284c7);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 15px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-link {
            background: transparent;
            color: #94a3b8;
        }

        .btn-link:hover {
            color: #ffffff;
        }

        .action-box {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
    </style>
</head>
<body>

    <main class="container">
        <div class="logo-container">
            <img src="logo.png" alt="La Casa de los Famosos Roblox" class="logo-img">
        </div>

        <h2>Contrato de Participación 📜</h2>
        <p class="desc">Consulta o descarga el comprobante oficial de registro y reglamento general de competencia para La Casa de los Famosos Roblox.</p>
        
        <div class="action-box">
            <!-- Descarga directa en PDF -->
            <a href="https://docs.google.com/document/d/1bQsubB8MwlzYT88YzNO1h8A8o9dvafS4NFBKovyC43k/export?format=pdf" target="_blank" class="btn btn-primary">
                📄 Descargar Contrato en PDF
            </a>

            <!-- Abrir vista previa en Google Docs -->
            <a href="https://docs.google.com/document/d/1bQsubB8MwlzYT88YzNO1h8A8o9dvafS4NFBKovyC43k/edit?usp=sharing" target="_blank" class="btn btn-secondary">
                👁️ Leer documento en línea
            </a>

            <!-- Volver a la página principal -->
            <a href="index.html" class="btn btn-link">Volver al inicio</a>
        </div>
    </main>

</body>
</html>
