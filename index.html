<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Casa de los Famosos Roblox</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Colores extraídos del logo */
            --blue-logo: #1c68f2;
            --blue-dark: #0f3ba1;
            --cyan-accent: #00d2ff;
            --text-color: #1a233a;
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            /* Fondo inspirado en las nubes pastel del logo */
            background: 
                radial-gradient(circle at 10% 20%, rgba(255, 182, 193, 0.6), transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(255, 236, 179, 0.6), transparent 40%),
                radial-gradient(circle at 50% 80%, rgba(206, 147, 216, 0.5), transparent 45%),
                radial-gradient(circle at 90% 80%, rgba(0, 210, 255, 0.4), transparent 40%),
                linear-gradient(135deg, #2b5876, #4e4376);
            background-attachment: fixed;
        }

        .main-container {
            width: 100%;
            max-width: 620px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 28px;
            padding: 35px 25px;
            box-shadow: 0 20px 50px rgba(15, 35, 90, 0.25);
            text-align: center;
        }

        /* LOGO */
        .logo-box {
            width: 100%;
            max-width: 320px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-img {
            width: 100%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 8px 15px rgba(0, 0, 0, 0.15));
        }

        p.subtitle {
            color: #2c3e50;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 25px;
        }

        /* SECCIÓN PRIORITARIA (VOTACIONES Y CONTRATO) */
        .priority-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .priority-card {
            background: rgba(255, 255, 255, 0.65);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 20px;
            text-align: left;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        }

        .priority-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 12px 25px rgba(28, 104, 242, 0.2);
        }

        .priority-card.vote {
            border-color: var(--cyan-accent);
        }

        .priority-card.contract {
            border-color: var(--blue-logo);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-icon {
            font-size: 1.2rem;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .vote .card-icon { background: linear-gradient(135deg, #00d2ff, #0072ff); }
        .contract .card-icon { background: linear-gradient(135deg, #1c68f2, #0f3ba1); }

        .badge {
            font-size: 0.7rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .vote .badge { background: rgba(0, 210, 255, 0.15); color: #0072ff; }
        .contract .badge { background: rgba(28, 104, 242, 0.15); color: var(--blue-logo); }

        .card-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--blue-dark);
            margin-bottom: 4px;
        }

        .card-desc {
            font-size: 0.82rem;
            color: #4a5568;
            line-height: 1.35;
        }

        /* SECCIÓN SECUNDARIA (LISTA COMPACTA Y LIMPIA) */
        .secondary-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sec-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 14px;
            text-decoration: none;
            color: var(--text-color);
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .sec-button:hover {
            background: rgba(255, 255, 255, 0.85);
            border-color: var(--cyan-accent);
            transform: translateX(3px);
        }

        .sec-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sec-left i {
            color: var(--blue-logo);
            width: 18px;
            font-size: 1.05rem;
        }

        .sec-arrow {
            font-size: 0.8rem;
            color: #718096;
        }

        footer {
            margin-top: 25px;
            font-size: 0.75rem;
            font-weight: 600;
            color: rgba(26, 35, 58, 0.6);
        }
    </style>
</head>
<body>

    <main class="main-container">

        <!-- LOGO -->
        <div class="logo-box">
            <img src="logo.png" alt="La Casa de los Famosos Roblox" class="logo-img">
        </div>

        <p class="subtitle">Portal Oficial de Acceso</p>

        <!-- OPCIONES PRIORITARIAS -->
        <div class="priority-section">
            
            <!-- VOTACIONES -->
            <a href="votaciones.html" class="priority-card vote">
                <div class="card-header">
                    <div class="card-icon"><i class="fa-solid fa-check-to-slot"></i></div>
                    <span class="badge">Oficial</span>
                </div>
                <div class="card-title">Votaciones</div>
                <div class="card-desc">Apoya a tu participante favorito para salvarlo.</div>
            </a>

            <!-- CONTRATO -->
            <a href="contrato.html" class="priority-card contract">
                <div class="card-header">
                    <div class="card-icon"><i class="fa-solid fa-file-signature"></i></div>
                    <span class="badge">28-29 Ago</span>
                </div>
                <div class="card-title">Contrato Oficial</div>
                <div class="card-desc">Firma digital para seleccionados.</div>
            </a>

        </div>

        <!-- OPCIONES SECUNDARIAS COMPACTAS -->
        <div class="secondary-list">

            <a href="registro.html" class="sec-button">
                <div class="sec-left">
                    <i class="fa-solid fa-pen-to-square"></i>
                    <span>Postulación (19 - 23 Ago)</span>
                </div>
                <i class="fa-solid fa-chevron-right sec-arrow"></i>
            </a>

            <a href="consulta.html" class="sec-button">
                <div class="sec-left">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span>Consultar Estado del Folio</span>
                </div>
                <i class="fa-solid fa-chevron-right sec-arrow"></i>
            </a>

            <a href="presentacion.html" class="sec-button">
                <div class="sec-left">
                    <i class="fa-solid fa-tv"></i>
                    <span>Presentación (31 Ago)</span>
                </div>
                <i class="fa-solid fa-chevron-right sec-arrow"></i>
            </a>

            <a href="https://whatsapp.com/channel/TU_LINK_AQUI" target="_blank" class="sec-button">
                <div class="sec-left">
                    <i class="fa-brands fa-whatsapp"></i>
                    <span>Canal de WhatsApp</span>
                </div>
                <i class="fa-solid fa-chevron-right sec-arrow"></i>
            </a>

            <a href="soporte.html" class="sec-button">
                <div class="sec-left">
                    <i class="fa-solid fa-headset"></i>
                    <span>Soporte y Ayuda</span>
                </div>
                <i class="fa-solid fa-chevron-right sec-arrow"></i>
            </a>

        </div>

        <footer>
            © 2026 LA CASA DE LOS FAMOSOS ROBLOX
        </footer>

    </main>

</body>
</html>
