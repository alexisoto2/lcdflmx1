<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Votaciones</title>
</head>
<body>

  <h2>Votación</h2>
  
  <form id="formVotacion">
    <label for="usuario">Tu Nombre / ID:</label><br>
    <input type="text" id="usuario" name="usuario" required><br><br>

    <label>Elige una opción:</label><br>
    <input type="radio" id="opcion1" name="voto" value="Opción A" required>
    <label for="opcion1">Opción A</label><br>
    <input type="radio" id="opcion2" name="voto" value="Opción B">
    <label for="opcion2">Opción B</label><br><br>

    <button type="submit">Enviar Voto</button>
  </form>

  <p id="mensaje"></p>

  <script>
    // URL integrada de tu Apps Script
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxV_ztBxEkBrto-W26fTGaQJly0FKwYHVNRzfzCHs4JXCq8cIVnAgI5pMQU390wWM_3Tg/exec';

    document.getElementById('formVotacion').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const mensaje = document.getElementById('mensaje');
      mensaje.innerText = "Enviando voto...";

      // Recopilar los datos del formulario
      const usuario = document.getElementById('usuario').value;
      const voto = document.querySelector('input[name="voto"]:checked').value;

      const payload = {
        usuario: usuario,
        voto: voto
      };

      // Enviar datos mediante POST
      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors', // Evita bloqueos de CORS con Google Apps Script
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        mensaje.innerText = "¡Tu voto ha sido registrado correctamente!";
        document.getElementById('formVotacion').reset();
      })
      .catch(error => {
        console.error('Error:', error);
        mensaje.innerText = "Hubo un error al registrar el voto.";
      });
    });
  </script>

</body>
</html>
