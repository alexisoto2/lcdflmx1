
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Votaciones | La Casa de los Famosos Roblox</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #fff;

      background:
        radial-gradient(circle at 15% 15%, #5ee7ff 0%, transparent 32%),
        radial-gradient(circle at 85% 15%, #b58cff 0%, transparent 35%),
        radial-gradient(circle at 50% 90%, #ffb5dc 0%, transparent 38%),
        linear-gradient(135deg, #075b72, #3d4bb5 45%, #7d3fc7);

      background-attachment: fixed;
      overflow-x: hidden;
    }

    /* Nubes decorativas */
    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .35;
      z-index: -1;
    }

    body::before {
      background: #72eaff;
      top: -180px;
      left: -120px;
    }

    body::after {
      background: #f7a9ff;
      right: -150px;
      bottom: -180px;
    }

    .contenedor {
      width: min(1100px, 92%);
      margin: auto;
      padding: 30px 0 60px;
    }

    /* LOGO */
    .logo-area {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-box {
      width: 230px;
      height: 160px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 15px;

      background: rgba(255,255,255,.16);
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 30px;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 15px 45px rgba(0,0,0,.22),
        inset 0 1px 1px rgba(255,255,255,.35);
    }

    .logo-box img {
      max-width: 100%;
      max-height: 130px;
      object-fit: contain;
    }

    .logo-placeholder {
      color: rgba(255,255,255,.8);
      font-size: 14px;
      text-align: center;
    }

    /* ENCABEZADO */

    .titulo {
      text-align: center;
      margin: 15px 0 8px;

      font-size: clamp(35px, 7vw, 65px);
      font-weight: 1000;
      letter-spacing: -2px;

      text-shadow:
        0 4px 0 #073b9c,
        0 8px 18px rgba(0,0,0,.35);
    }

    .subtitulo {
      text-align: center;
      font-size: 17px;
      color: rgba(255,255,255,.9);
      margin-bottom: 35px;
    }

    /* AVISO */

    .aviso {
      max-width: 750px;
      margin: 0 auto 35px;

      padding: 18px 22px;

      text-align: center;

      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 20px;

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      box-shadow: 0 10px 35px rgba(0,0,0,.15);
    }

    .aviso strong {
      color: #fff;
    }

    /* PARTICIPANTES */

    .participantes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 24px;
    }

    .participante {
      overflow: hidden;

      background: rgba(255,255,255,.17);
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 28px;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 18px 45px rgba(0,0,0,.22),
        inset 0 1px 1px rgba(255,255,255,.3);

      transition: .3s ease;
    }

    .participante:hover {
      transform: translateY(-8px) scale(1.015);
      box-shadow: 0 25px 55px rgba(0,0,0,.3);
    }

    .foto {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }

    .info {
      padding: 20px;
      text-align: center;
    }

    .nombre {
      font-size: 23px;
      font-weight: 900;
      margin-bottom: 15px;

      text-shadow: 0 3px 8px rgba(0,0,0,.3);
    }

    .boton-votar {
      width: 100%;
      border: none;
      padding: 14px 20px;

      border-radius: 50px;

      color: white;
      font-size: 17px;
      font-weight: 900;

      cursor: pointer;

      background: linear-gradient(
        135deg,
        #168cff,
        #5b3cff,
        #a438ff
      );

      box-shadow:
        0 7px 20px rgba(36,92,255,.4),
        inset 0 1px rgba(255,255,255,.4);

      transition: .25s;
    }

    .boton-votar:hover {
      transform: scale(1.04);
      filter: brightness(1.12);
    }

    .boton-votar:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    /* MENSAJE */

    #mensaje {
      position: fixed;
      left: 50%;
      bottom: 25px;

      transform: translateX(-50%) translateY(100px);

      width: min(90%, 450px);

      padding: 16px 20px;

      text-align: center;
      font-weight: 800;

      background: rgba(20,20,60,.85);
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 18px;

      backdrop-filter: blur(15px);

      box-shadow: 0 15px 40px rgba(0,0,0,.3);

      transition: .35s;

      z-index: 100;
    }

    #mensaje.mostrar {
      transform: translateX(-50%) translateY(0);
    }

    footer {
      text-align: center;
      margin-top: 50px;
      color: rgba(255,255,255,.7);
      font-size: 13px;
    }

    /* CELULAR */

    @media (max-width: 600px) {

      .contenedor {
        padding-top: 20px;
      }

      .logo-box {
        width: 190px;
        height: 135px;
      }

      .titulo {
        font-size: 42px;
      }

      .subtitulo {
        font-size: 15px;
      }

      .participantes {
        grid-template-columns: 1fr;
      }

      .foto {
        height: 300px;
      }
    }
  </style>
</head>

<body>

  <main class="contenedor">

    <!-- LOGO -->
    <section class="logo-area">

      <div class="logo-box">

        <!--
          CAMBIA logo.png POR EL NOMBRE DE TU LOGO
          QUE TENGAS EN GITHUB.
        -->

        <img
          src="logo.png"
          alt="La Casa de los Famosos Roblox"
          onerror="this.style.display='none'; document.getElementById('logoTexto').style.display='block';"
        >

        <div id="logoTexto" class="logo-placeholder" style="display:none;">
          Coloca aquí tu logo
        </div>

      </div>

    </section>


    <!-- TITULO -->

    <h1 class="titulo">
      VOTACIONES
    </h1>

    <p class="subtitulo">
      La Casa de los Famosos Roblox
    </p>


    <!-- AVISO -->

    <div class="aviso">

      🗳️ <strong>¡Es momento de votar!</strong>

      <br>

      Selecciona al habitante por quien quieres votar.

    </div>


    <!-- PARTICIPANTES -->

    <section class="participantes">


      <!-- PARTICIPANTE 1 -->

      <article class="participante">

        <img
          class="foto"
          src="participante1.jpg"
          alt="Participante 1"
        >

        <div class="info">

          <div class="nombre">
            Participante 1
          </div>

          <button
            class="boton-votar"
            onclick="enviarVoto('Participante 1', this)"
          >
            🗳️ VOTAR
          </button>

        </div>

      </article>


      <!-- PARTICIPANTE 2 -->

      <article class="participante">

        <img
          class="foto"
          src="participante2.jpg"
          alt="Participante 2"
        >

        <div class="info">

          <div class="nombre">
            Participante 2
          </div>

          <button
            class="boton-votar"
            onclick="enviarVoto('Participante 2', this)"
          >
            🗳️ VOTAR
          </button>

        </div>

      </article>


      <!-- PARTICIPANTE 3 -->

      <article class="participante">

        <img
          class="foto"
          src="participante3.jpg"
          alt="Participante 3"
        >

        <div class="info">

          <div class="nombre">
            Participante 3
          </div>

          <button
            class="boton-votar"
            onclick="enviarVoto('Participante 3', this)"
          >
            🗳️ VOTAR
          </button>

        </div>

      </article>


      <!-- COPIA ESTA TARJETA PARA MÁS PARTICIPANTES -->


    </section>


    <footer>
      © 2026 La Casa de los Famosos Roblox
    </footer>

  </main>


  <!-- MENSAJE -->

  <div id="mensaje"></div>


  <script>

    /*
      ============================================
      GOOGLE APPS SCRIPT
      ============================================
    */

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzewT05r954ylI7xAohfrs0EB2ikc41q9fRWC8S-TDtRkvkFTFF0O0sbQIcav6CCR_isQ/exec";


    /*
      ============================================
      ENVIAR VOTO
      ============================================
    */

    async function enviarVoto(participante, boton) {

      if (!participante) {
        mostrarMensaje("❌ Participante no válido.");
        return;
      }

      boton.disabled = true;
      boton.textContent = "⏳ ENVIANDO...";


      try {

        const respuesta = await fetch(APPS_SCRIPT_URL, {

          method: "POST",

          body: JSON.stringify({
            participante: participante
          })

        });


        const resultado = await respuesta.json();


        if (resultado.ok) {

          boton.textContent = "✅ VOTO REGISTRADO";

          mostrarMensaje(
            "🎉 ¡Tu voto por " +
            participante +
            " fue registrado correctamente!"
          );

        } else {

          boton.disabled = false;
          boton.textContent = "🗳️ VOTAR";

          mostrarMensaje(
            "❌ " + resultado.mensaje
          );

        }


      } catch (error) {

        console.error(error);

        boton.disabled = false;
        boton.textContent = "🗳️ VOTAR";

        mostrarMensaje(
          "❌ No se pudo conectar con el sistema de votaciones."
        );

      }

    }


    /*
      ============================================
      MENSAJE
      ============================================
    */

    function mostrarMensaje(texto) {

      const mensaje =
        document.getElementById("mensaje");

      mensaje.textContent = texto;

      mensaje.classList.add("mostrar");


      setTimeout(() => {

        mensaje.classList.remove("mostrar");

      }, 4000);

    }

  </script>

</body>
</html>
```
