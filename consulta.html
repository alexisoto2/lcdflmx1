<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Consulta de Folio | La Casa de los Famosos Roblox
    </title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            padding: 20px 15px;

            color: #ffffff;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(0, 220, 255, .75),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 10%,
                    rgba(170, 80, 255, .75),
                    transparent 32%
                ),

                radial-gradient(
                    circle at 50% 90%,
                    rgba(255, 150, 220, .65),
                    transparent 38%
                ),

                linear-gradient(
                    135deg,
                    #063d50,
                    #292b88 48%,
                    #7337a7
                );

            background-attachment: fixed;

            overflow-x: hidden;

        }


        body::before,
        body::after {

            content: "";

            position: fixed;

            z-index: -1;

            border-radius: 50%;

            filter: blur(90px);

            pointer-events: none;

        }


        body::before {

            width: 420px;
            height: 420px;

            top: -170px;
            left: -130px;

            background:
                rgba(65, 225, 255, .35);

        }


        body::after {

            width: 520px;
            height: 520px;

            right: -200px;
            bottom: -220px;

            background:
                rgba(226, 135, 255, .35);

        }


        /* =====================================
           CONTENEDOR PRINCIPAL
        ===================================== */

        .container {

            width: 100%;

            max-width: 590px;

            margin: auto;

            padding:
                30px
                25px
                35px;

            text-align: center;

            background:
                rgba(255, 255, 255, .11);

            border:
                1px solid
                rgba(255, 255, 255, .28);

            border-radius: 32px;

            backdrop-filter: blur(22px);

            -webkit-backdrop-filter:
                blur(22px);

            box-shadow:

                0 25px 70px
                rgba(0, 0, 0, .38),

                inset 0 1px 2px
                rgba(255, 255, 255, .35);

        }


        /* =====================================
           LOGO
        ===================================== */

        .logo-container {

            display: flex;

            justify-content: center;

            margin-bottom: 20px;

        }


        .logo-box {

            width:
                min(390px, 100%);

            min-height: 145px;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 12px;

            border-radius: 28px;

            background:
                rgba(255, 255, 255, .10);

            border:
                1px solid
                rgba(255, 255, 255, .25);

            backdrop-filter:
                blur(15px);

            box-shadow:

                0 15px 40px
                rgba(0, 0, 0, .25),

                inset 0 1px 2px
                rgba(255, 255, 255, .3);

        }


        .logo-img {

            width: 100%;

            max-width: 350px;

            max-height: 155px;

            object-fit: contain;

            filter:

                drop-shadow(
                    0 10px 12px
                    rgba(0, 0, 0, .35)
                )

                drop-shadow(
                    0 0 25px
                    rgba(0, 190, 255, .35)
                );

            transition:
                transform .3s ease;

        }


        .logo-img:hover {

            transform:
                scale(1.035);

        }


        /* =====================================
           ENCABEZADO
        ===================================== */

        .header h1 {

            margin-top: 12px;

            margin-bottom: 8px;

            font-size:
                clamp(
                    1.6rem,
                    5vw,
                    2.2rem
                );

            font-weight: 1000;

            text-transform:
                uppercase;

            letter-spacing:
                1.5px;

            text-shadow:

                0 3px 0
                #1556c5,

                0 7px 15px
                rgba(0, 0, 0, .45);

        }


        .header p {

            color:
                rgba(255, 255, 255, .75);

            font-size:
                .9rem;

            line-height:
                1.5;

            margin-bottom:
                20px;

        }


        .tag {

            display:
                inline-block;

            margin-bottom:
                22px;

            padding:
                6px 14px;

            border-radius:
                30px;

            background:
                rgba(255, 255, 255, .12);

            border:
                1px solid
                rgba(255, 255, 255, .22);

            color:
                #dff8ff;

            font-size:
                .7rem;

            font-weight:
                900;

            letter-spacing:
                1px;

            text-transform:
                uppercase;

        }


        /* =====================================
           FORMULARIO
        ===================================== */

        .form-card {

            padding:
                22px 20px;

            border-radius:
                22px;

            background:
                rgba(255, 255, 255, .07);

            border:
                1px solid
                rgba(255, 255, 255, .16);

            box-shadow:
                inset 0 1px 1px
                rgba(255, 255, 255, .15);

        }


        .form-group {

            margin-bottom:
                18px;

            text-align:
                left;

        }


        label {

            display:
                block;

            margin-bottom:
                8px;

            color:
                rgba(255, 255, 255, .88);

            font-size:
                .84rem;

            font-weight:
                700;

        }


        input[type="text"] {

            width:
                100%;

            padding:
                14px 15px;

            border-radius:
                14px;

            border:
                1px solid
                rgba(255, 255, 255, .22);

            background:
                rgba(5, 15, 45, .35);

            color:
                #ffffff;

            font-size:
                1rem;

            outline:
                none;

            text-align:
                center;

            letter-spacing:
                1.5px;

            text-transform:
                uppercase;

            transition:
                .25s ease;

        }


        input[type="text"]::placeholder {

            color:
                rgba(255, 255, 255, .35);

        }


        input[type="text"]:focus {

            border-color:
                #55dfff;

            background:
                rgba(5, 15, 45, .48);

            box-shadow:

                0 0 0 3px
                rgba(85, 223, 255, .10),

                0 0 20px
                rgba(85, 223, 255, .12);

            transform:
                translateY(-1px);

        }


        /* =====================================
           BOTONES
        ===================================== */

        .btn {

            display:
                block;

            width:
                100%;

            padding:
                14px 18px;

            border-radius:
                14px;

            border:
                none;

            font-size:
                .92rem;

            font-weight:
                900;

            text-decoration:
                none;

            cursor:
                pointer;

            text-align:
                center;

            transition:
                .25s ease;

        }


        .btn-primary {

            color:
                #ffffff;

            background:

                linear-gradient(
                    135deg,
                    #078fff,
                    #513cff,
                    #a53dff
                );

            box-shadow:

                0 8px 25px
                rgba(47, 102, 255, .40),

                inset 0 1px 1px
                rgba(255, 255, 255, .45);

        }


        .btn-primary:hover {

            transform:
                translateY(-2px)
                scale(1.01);

            box-shadow:

                0 12px 32px
                rgba(79, 83, 255, .55),

                0 0 25px
                rgba(57, 195, 255, .20);

        }


        .btn-primary:disabled {

            opacity:
                .6;

            cursor:
                wait;

            transform:
                none;

        }


        .btn-link {

            margin-top:
                10px;

            color:
                rgba(255, 255, 255, .65);

            background:
                rgba(255, 255, 255, .05);

            border:
                1px solid
                rgba(255, 255, 255, .12);

        }


        .btn-link:hover {

            color:
                #ffffff;

            background:
                rgba(255, 255, 255, .12);

        }


        /* =====================================
           RESULTADO
        ===================================== */

        #resultado {

            margin-top:
                22px;

        }


        .result-card,
        .message {

            padding:
                22px;

            border-radius:
                20px;

            text-align:
                left;

            animation:
                fadeIn .3s ease;

        }


        /* =====================================
           SELECCIONADO
        ===================================== */

        .result-card {

            background:

                linear-gradient(
                    135deg,
                    rgba(16, 185, 129, .18),
                    rgba(0, 200, 255, .10)
                );

            border:
                1px solid
                rgba(52, 211, 153, .65);

            box-shadow:

                0 10px 30px
                rgba(0, 0, 0, .18),

                0 0 20px
                rgba(16, 185, 129, .08);

        }


        .result-icon {

            font-size:
                2.7rem;

            margin-bottom:
                8px;

            text-align:
                center;

        }


        .selected-badge {

            display:
                inline-block;

            margin-bottom:
                12px;

            padding:
                6px 11px;

            border-radius:
                20px;

            background:
                rgba(16, 185, 129, .22);

            border:
                1px solid
                rgba(52, 211, 153, .5);

            color:
                #6ee7b7;

            font-size:
                .7rem;

            font-weight:
                900;

            letter-spacing:
                1px;

        }


        .result-card h2,
        .message h3 {

            font-size:
                1.25rem;

            margin-bottom:
                10px;

            color:
                #ffffff;

        }


        .result-card p,
        .message p {

            font-size:
                .87rem;

            color:
                rgba(255, 255, 255, .76);

            margin-bottom:
                7px;

            line-height:
                1.5;

        }


        /* =====================================
           DATOS DEL SELECCIONADO
        ===================================== */

        .datos-seleccionado {

            display:
                flex;

            flex-direction:
                column;

            gap:
                10px;

            margin-top:
                18px;

        }


        .dato {

            display:
                flex;

            flex-direction:
                column;

            gap:
                6px;

            padding:
                11px 13px;

            border-radius:
                12px;

            background:
                rgba(0, 0, 0, .18);

            border:
                1px solid
                rgba(255, 255, 255, .10);

        }


        .dato span {

            color:
                rgba(255, 255, 255, .65);

            font-size:
                .72rem;

            font-weight:
                800;

            text-transform:
                uppercase;

            letter-spacing:
                .5px;

        }


        code {

            display:
                block;

            width:
                100%;

            background:
                rgba(0, 0, 0, .28);

            padding:
                7px 9px;

            border-radius:
                8px;

            color:
                #65ddff;

            font-family:
                monospace;

            font-size:
                .82rem;

            overflow-wrap:
                anywhere;

        }


        /* =====================================
           AVISO
        ===================================== */

        .aviso-datos {

            margin-top:
                15px;

            padding:
                12px;

            border-radius:
                12px;

            background:
                rgba(245, 158, 11, .10);

            border:
                1px solid
                rgba(245, 158, 11, .30);

            color:
                #fde68a;

            font-size:
                .75rem;

            line-height:
                1.4;

            text-align:
                center;

        }


        /* =====================================
           RECHAZADO
        ===================================== */

        .message.error {

            background:

                linear-gradient(
                    135deg,
                    rgba(239, 68, 68, .18),
                    rgba(255, 80, 130, .08)
                );

            border:
                1px solid
                rgba(239, 68, 68, .65);

        }


        /* =====================================
           PENDIENTE
        ===================================== */

        .message.pending {

            background:

                linear-gradient(
                    135deg,
                    rgba(245, 158, 11, .17),
                    rgba(255, 200, 70, .08)
                );

            border:
                1px solid
                rgba(245, 158, 11, .65);

        }


        /* =====================================
           CARGANDO
        ===================================== */

        .loading {

            padding:
                17px;

            border-radius:
                15px;

            color:
                rgba(255, 255, 255, .72);

            background:
                rgba(255, 255, 255, .06);

            border:
                1px solid
                rgba(255, 255, 255, .12);

            text-align:
                center;

            font-size:
                .85rem;

        }


        .spinner {

            width:
                24px;

            height:
                24px;

            margin:
                0 auto 10px;

            border-radius:
                50%;

            border:
                3px solid
                rgba(255,255,255,.2);

            border-top-color:
                #55dcff;

            animation:
                spin .8s linear infinite;

        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }

        }


        @keyframes fadeIn {

            from {

                opacity:
                    0;

                transform:
                    translateY(8px);

            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0);

            }

        }


        /* =====================================
           FOOTER
        ===================================== */

        footer {

            margin-top:
                25px;

            color:
                rgba(255, 255, 255, .4);

            font-size:
                .7rem;

        }


        /* =====================================
           CELULAR
        ===================================== */

        @media (max-width: 600px) {

            body {

                padding:
                    12px;

            }


            .container {

                padding:
                    23px
                    17px
                    28px;

                border-radius:
                    27px;

            }


            .logo-box {

                min-height:
                    130px;

            }


            .logo-img {

                max-height:
                    135px;

            }


            .form-card {

                padding:
                    18px 15px;

            }

        }

    </style>

</head>


<body>


    <main class="container">


        <!-- ==================================
             LOGO
        =================================== -->

        <div class="logo-container">

            <div class="logo-box">

                <img
                    src="logo.png"
                    alt="La Casa de los Famosos Roblox"
                    class="logo-img"
                >

            </div>

        </div>


        <!-- ==================================
             ENCABEZADO
        =================================== -->

        <header class="header">

            <h1>
                Consultar Folio
            </h1>

            <p>
                Consulta el estado de tu postulación
                a La Casa de los Famosos Roblox.
            </p>

            <span class="tag">
                🔍 Consulta de solicitud
            </span>

        </header>


        <!-- ==================================
             FORMULARIO
        =================================== -->

        <div class="form-card">

            <form id="formConsulta">


                <div class="form-group">

                    <label for="folio">
                        Ingresa tu código de seguimiento:
                    </label>


                    <input
                        type="text"
                        id="folio"
                        name="folio"
                        placeholder="Ej. LCDLF-8A92"
                        autocomplete="off"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >

                    🔍 BUSCAR ESTADO

                </button>


                <a
                    href="index.html"
                    class="btn btn-link"
                >

                    ← Volver al menú

                </a>


            </form>

        </div>


        <!-- ==================================
             RESULTADO
        =================================== -->

        <div id="resultado"></div>


        <footer>

            © 2026 La Casa de los Famosos Roblox

        </footer>


    </main>


    <script>


        /* ==========================================
           URL DE GOOGLE APPS SCRIPT
        ========================================== */

        const APPS_SCRIPT_URL =
            "https://script.google.com/macros/s/AKfycbxpYRNTRTROKznUfepJqJdvVQnLDx2K8TVret7AIUokaE6AEr4_Vxw0gH9AkTeuYe8m/exec";


        /* ==========================================
           PROTEGER TEXTO HTML
        ========================================== */

        function escapar(texto) {

            if (
                texto === null ||
                texto === undefined
            ) {

                return "";

            }


            return String(texto)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* ==========================================
           LLAMAR A GOOGLE APPS SCRIPT
        ========================================== */

        function llamarAPI(
            accion,
            parametros = {}
        ) {


            return new Promise(
                (resolve, reject) => {


                    const callbackName =

                        "jsonp_cb_" +

                        Math.random()
                            .toString(36)
                            .substring(2, 15);


                    const urlParams =

                        new URLSearchParams({

                            action:
                                accion,

                            callback:
                                callbackName,

                            ...parametros

                        });


                    const script =
                        document.createElement(
                            "script"
                        );


                    script.src =

                        `${APPS_SCRIPT_URL}?${urlParams.toString()}`;


                    window[callbackName] =

                        function(respuesta) {


                            cleanup();


                            if (

                                respuesta &&

                                respuesta.success

                            ) {

                                resolve(
                                    respuesta
                                );

                            } else {

                                reject(

                                    new Error(

                                        respuesta?.message ||

                                        "Error al consultar el folio."

                                    )

                                );

                            }

                        };


                    script.onerror =

                        function() {


                            cleanup();


                            reject(

                                new Error(

                                    "Error de conexión con el servidor."

                                )

                            );

                        };


                    function cleanup() {


                        delete
                            window[callbackName];


                        if (
                            script.parentNode
                        ) {

                            script.parentNode
                                .removeChild(
                                    script
                                );

                        }

                    }


                    document.body.appendChild(
                        script
                    );


                }
            );

        }


        /* ==========================================
           CONSULTA AUTOMÁTICA POR URL
           
           Ejemplo:
           consulta.html?folio=LCDLF-1234
        ========================================== */

        window.addEventListener(
            "DOMContentLoaded",
            function() {


                const urlParams =

                    new URLSearchParams(
                        window.location.search
                    );


                const folioUrl =

                    urlParams.get(
                        "folio"
                    );


                if (folioUrl) {


                    document
                        .getElementById(
                            "folio"
                        )
                        .value =
                        folioUrl;


                    document
                        .getElementById(
                            "formConsulta"
                        )
                        .requestSubmit();

                }

            }
        );


        /* ==========================================
           FORMULARIO DE CONSULTA
        ========================================== */

        document
            .getElementById(
                "formConsulta"
            )
            .addEventListener(
                "submit",
                async function(e) {


                    e.preventDefault();


                    const folioInput =

                        document.getElementById(
                            "folio"
                        );


                    const resultado =

                        document.getElementById(
                            "resultado"
                        );


                    const submitBtn =

                        e.target.querySelector(
                            'button[type="submit"]'
                        );


                    const folio =

                        folioInput.value
                            .trim();


                    if (!folio) {

                        return;

                    }


                    try {


                        submitBtn.disabled =
                            true;


                        resultado.innerHTML = `

                            <div class="loading">

                                <div class="spinner"></div>

                                Buscando tu folio
                                en la base de datos...

                            </div>

                        `;


                        const respuesta =

                            await llamarAPI(

                                "consultarFolio",

                                {
                                    folio:
                                        folio
                                }

                            );


                        const datos =
                            respuesta.datos;


                        let estadoHtml = "";


                        /* =================================
                           ACEPTADO
                        ================================= */

                        if (
                            datos.estado ===
                            "Aceptado"
                        ) {


                            estadoHtml = `

                                <div class="result-card">


                                    <div class="result-icon">
                                        👑
                                    </div>


                                    <div
                                        style="
                                            text-align:center;
                                        "
                                    >

                                        <span
                                            class="selected-badge"
                                        >

                                            ✓ ¡SELECCIONADO!

                                        </span>

                                    </div>


                                    <h2>

                                        ¡Felicidades,
                                        ${escapar(datos.nombre)}!

                                    </h2>


                                    <p>

                                        Has sido seleccionado
                                        para ingresar a

                                        <strong>
                                            La Casa de los
                                            Famosos Roblox
                                        </strong>.

                                    </p>


                                    <div
                                        class="datos-seleccionado"
                                    >


                                        <!-- ROBLOX -->

                                        <div class="dato">

                                            <span>
                                                🎮 Usuario Roblox
                                            </span>

                                            <code>
                                                ${escapar(datos.roblox)}
                                            </code>

                                        </div>


                                        <!-- CORREO -->

                                        <div class="dato">

                                            <span>
                                                📧 Correo
                                            </span>

                                            <code>
                                                ${escapar(datos.correo)}
                                            </code>

                                        </div>


                                        <!-- CORREO INSTITUCIONAL -->

                                        <div class="dato">

                                            <span>
                                                🏢 Correo institucional
                                            </span>

                                            <code>
                                                ${escapar(
                                                    datos.correoInstitucional
                                                )}
                                            </code>

                                        </div>


                                        <!-- CONTRASEÑA -->

                                        <div class="dato">

                                            <span>
                                                🔐 Contraseña de correo
                                            </span>

                                            <code>
                                                ${escapar(
                                                    datos.passwordCorreo
                                                )}
                                            </code>

                                        </div>


                                        <!-- WHATSAPP -->

                                        <div class="dato">

                                            <span>
                                                📱 WhatsApp
                                            </span>

                                            <code>
                                                ${escapar(
                                                    datos.whatsapp
                                                )}
                                            </code>

                                        </div>


                                        <!-- DISCORD -->

                                        <div class="dato">

                                            <span>
                                                💬 Discord
                                            </span>

                                            <code>
                                                ${escapar(
                                                    datos.discord
                                                )}
                                            </code>

                                        </div>


                                        <!-- FOLIO -->

                                        <div class="dato">

                                            <span>
                                                🎫 Folio
                                            </span>

                                            <code>
                                                ${escapar(
                                                    datos.folio
                                                )}
                                            </code>

                                        </div>


                                    </div>


                                    <div class="aviso-datos">

                                        ⚠️ Guarda estos datos
                                        en un lugar seguro.
                                        No compartas tu contraseña
                                        con otras personas.

                                    </div>


                                </div>

                            `;

                        }


                        /* =================================
                           RECHAZADO
                        ================================= */

                        else if (
                            datos.estado ===
                            "Rechazado"
                        ) {


                            estadoHtml = `

                                <div
                                    class="message error"
                                >


                                    <div
                                        class="result-icon"
                                    >
                                        😔
                                    </div>


                                    <h3>

                                        Solicitud
                                        No Seleccionada

                                    </h3>


                                    <p>

                                        Gracias por tu interés,

                                        <strong>
                                            ${escapar(
                                                datos.nombre
                                            )}
                                        </strong>.

                                    </p>


                                    <p>

                                        Desafortunadamente
                                        no fuiste seleccionado
                                        en esta ocasión.

                                    </p>


                                </div>

                            `;

                        }


                        /* =================================
                           PENDIENTE
                        ================================= */

                        else {


                            estadoHtml = `

                                <div
                                    class="message pending"
                                >


                                    <div
                                        class="result-icon"
                                    >
                                        ⏳
                                    </div>


                                    <h3>

                                        Solicitud
                                        En Revisión

                                    </h3>


                                    <p>

                                        Hola

                                        <strong>
                                            ${escapar(
                                                datos.nombre
                                            )}
                                        </strong>.

                                    </p>


                                    <p>

                                        Tu solicitud con folio

                                        <code>
                                            ${escapar(
                                                datos.folio
                                            )}
                                        </code>

                                        continúa en proceso
                                        de evaluación por el
                                        equipo de producción.

                                    </p>


                                </div>

                            `;

                        }


                        resultado.innerHTML =
                            estadoHtml;


                    }


                    catch (error) {


                        resultado.innerHTML = `

                            <div
                                class="message error"
                            >


                                <div
                                    class="result-icon"
                                >
                                    ⚠️
                                </div>


                                <h3>

                                    No se pudo realizar
                                    la consulta

                                </h3>


                                <p>

                                    ${escapar(
                                        error.message
                                    )}

                                </p>


                            </div>

                        `;

                    }


                    finally {


                        submitBtn.disabled =
                            false;

                    }


                }
            );


    </script>


</body>
