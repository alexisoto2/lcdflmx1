<script>

/* =====================================================
   TU APPS SCRIPT
   NO MODIFICADO
===================================================== */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxpYRNTRTROKznUfepJqJdvVQnLDx2K8TVret7AIUokaE6AEr4_Vxw0gH9AkTeuYe8m/exec";


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapar(texto){

    if(texto === null || texto === undefined){

        return "";

    }

    return String(texto)

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   CONSULTAR APPS SCRIPT
===================================================== */

function consultarAPI(folio){

    return new Promise((resolve,reject)=>{

        const callbackName =
            "callback_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2);


        const script =
            document.createElement("script");


        const url =
            APPS_SCRIPT_URL +
            "?action=consultarFolio" +
            "&folio=" +
            encodeURIComponent(folio) +
            "&callback=" +
            encodeURIComponent(callbackName);


        let terminado = false;


        const limpiar = () => {

            if(terminado) return;

            terminado = true;

            delete window[callbackName];

            if(script.parentNode){

                script.parentNode.removeChild(script);

            }

        };


        window[callbackName] = function(respuesta){

            limpiar();

            if(
                respuesta &&
                respuesta.success === true
            ){

                resolve(respuesta);

            }else{

                reject(
                    new Error(
                        respuesta?.message ||
                        "No se encontró información."
                    )
                );

            }

        };


        script.onerror = function(){

            limpiar();

            reject(
                new Error(
                    "No se pudo conectar con la Base de Datos."
                )
            );

        };


        script.src = url;


        document.body.appendChild(script);


        setTimeout(()=>{

            if(!terminado){

                limpiar();

                reject(
                    new Error(
                        "El servidor tardó demasiado en responder."
                    )
                );

            }

        },15000);

    });

}


/* =====================================================
   MOSTRAR RESULTADO
===================================================== */

function mostrarResultado(datos){

    const resultado =
        document.getElementById("resultado");


    const estado =
        String(datos.estado || "Pendiente")
            .trim()
            .toLowerCase();


    /* =================================================
       ACEPTADO
    ================================================= */

    if(
        estado === "aceptado" ||
        estado === "aceptada" ||
        estado === "seleccionado" ||
        estado === "seleccionada"
    ){

        resultado.innerHTML = `

            <div class="result-card">

                <div class="icon">
                    👑
                </div>

                <span class="badge">
                    ✓ ¡SELECCIONADO!
                </span>

                <h2>
                    ¡Felicidades, ${escapar(datos.nombre)}!
                </h2>

                <p>

                    Has sido seleccionado para ingresar a
                    <strong>
                        La Casa de los Famosos Roblox
                    </strong>.

                </p>


                <div class="dato">

                    <strong>
                        🎮 Usuario Roblox
                    </strong>

                    <code>
                        ${escapar(datos.roblox)}
                    </code>

                </div>


                <div class="dato">

                    <strong>
                        📧 Correo
                    </strong>

                    <code>
                        ${escapar(datos.correo)}
                    </code>

                </div>


                <div class="dato">

                    <strong>
                        🏢 Correo Institucional
                    </strong>

                    <code>
                        ${escapar(datos.correoLCDLF)}
                    </code>

                </div>


                <div class="dato">

                    <strong>
                        🔐 Contraseña
                    </strong>

                    <code>
                        ${escapar(datos.contraseña)}
                    </code>

                </div>


                <div class="dato">

                    <strong>
                        📱 WhatsApp
                    </strong>

                    <code>
                        ${escapar(datos.whatsapp)}
                    </code>

                </div>


                <div class="dato">

                    <strong>
                        💬 Discord
                    </strong>

                    <code>
                        ${escapar(datos.discord)}
                    </code>

                </div>


                <div class="dato">

                    <strong>
                        🏠 Habitación
                    </strong>

                    <code>
                        ${escapar(datos.habitacion)}
                    </code>

                </div>


                <div class="dato">

                    <strong>
                        🎫 Folio
                    </strong>

                    <code>
                        ${escapar(datos.folio)}
                    </code>

                </div>

            </div>

        `;

        return;

    }


    /* =================================================
       RECHAZADO
    ================================================= */

    if(
        estado === "rechazado" ||
        estado === "rechazada" ||
        estado === "no seleccionado" ||
        estado === "no seleccionada"
    ){

        resultado.innerHTML = `

            <div class="message error">

                <div class="icon">
                    😔
                </div>

                <h3>
                    Solicitud no seleccionada
                </h3>

                <p>

                    Gracias por tu interés,
                    <strong>
                        ${escapar(datos.nombre)}
                    </strong>.

                </p>

                <p>

                    Desafortunadamente no fuiste
                    seleccionado en esta ocasión.

                </p>

            </div>

        `;

        return;

    }


    /* =================================================
       PENDIENTE
    ================================================= */

    resultado.innerHTML = `

        <div class="message pending">

            <div class="icon">
                ⏳
            </div>

            <h3>
                Solicitud en revisión
            </h3>

            <p>

                Hola
                <strong>
                    ${escapar(datos.nombre)}
                </strong>.

            </p>

            <p>

                Tu solicitud con folio

                <code>
                    ${escapar(datos.folio)}
                </code>

                continúa en proceso de evaluación.

            </p>

        </div>

    `;

}


/* =====================================================
   FORMULARIO
===================================================== */

document
    .getElementById("formConsulta")
    .addEventListener("submit",async function(e){

        e.preventDefault();


        const folioInput =
            document.getElementById("folio");


        const btn =
            document.getElementById("btnBuscar");


        const resultado =
            document.getElementById("resultado");


        const folio =
            folioInput.value
                .trim()
                .toUpperCase();


        if(!folio){

            return;

        }


        btn.disabled = true;


        resultado.innerHTML = `

            <div class="loading">

                <div class="spinner"></div>

                Consultando Google Sheets...

            </div>

        `;


        try{

            const respuesta =
                await consultarAPI(folio);


            if(
                !respuesta ||
                !respuesta.datos
            ){

                throw new Error(
                    "Google Apps Script no devolvió los datos."
                );

            }


            mostrarResultado(
                respuesta.datos
            );


        }catch(error){

            resultado.innerHTML = `

                <div class="message error">

                    <div class="icon">
                        ⚠️
                    </div>

                    <h3>
                        No se pudo consultar
                    </h3>

                    <p>
                        ${escapar(error.message)}
                    </p>

                    <p style="margin-top:12px;font-size:.75rem;">

                        Verifica que el folio exista
                        y que Apps Script esté publicado
                        como "Cualquier usuario".

                    </p>

                </div>

            `;

        }finally{

            btn.disabled = false;

        }

    });


/* =====================================================
   CONSULTA AUTOMÁTICA
   consulta.html?folio=LCDLF-XXXX

window.addEventListener(
    "DOMContentLoaded",
    function(){

        const params =
            new URLSearchParams(
                window.location.search
            );


        const folio =
            params.get("folio");


        if(folio){

            document
                .getElementById("folio")
                .value =
                    folio.toUpperCase();


            document
                .getElementById("formConsulta")
                .requestSubmit();

        }

    }
);

</script>
