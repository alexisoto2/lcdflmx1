<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Folio - LCDLF Roblox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #2e1065, #0f051d);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .logo-container {
            margin-bottom: 15px;
        }

        .logo-img {
            max-width: 260px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 8px 16px rgba(0, 162, 255, 0.4));
        }

        h2 {
            font-size: 1.6rem;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            text-align: center;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #059669, #10b981);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
            margin-bottom: 12px;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #047857, #059669);
        }

        .btn-link {
            background: transparent;
            color: #94a3b8;
        }

        .btn-link:hover {
            color: #ffffff;
        }

        /* Contenedores de respuesta */
        #resultado {
            margin-top: 25px;
        }

        .result-card, .message {
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left;
            animation: fadeIn 0.3s ease-in-out;
        }

        .result-card {
            background: rgba(16, 185, 129, 0.15);
            border-color: #10b981;
        }

        .message.pending {
            background: rgba(245, 158, 11, 0.15);
            border-color: #f59e0b;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.15);
            border-color: #ef4444;
        }

        .selected-badge {
            display: inline-block;
            background: #10b981;
            color: #fff;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 6px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .result-card h2, .message h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: #fff;
        }

        .result-card p, .message p {
            font-size: 0.9rem;
            color: #e2e8f0;
            margin-bottom: 6px;
        }

        code {
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 6px;
            border-radius: 4px;
            color: #38bdf8;
            font-family: monospace;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <main class="container">
        <!-- Logo de La Casa de los Famosos Roblox -->
        <div class="logo-container">
            <img src="logo.png" alt="La Casa de los Famosos Roblox" class="logo-img">
        </div>

        <h2>Consultar Folio 🔍</h2>

        <form id="formConsulta">
            <div class="form-group">
                <label for="folio">Ingresa tu código de seguimiento:</label>
                <input type="text" id="folio" name="folio" placeholder="Ej. LCDLF-8A92" required>
            </div>
            <button type="submit" class="btn btn-primary">Buscar Estado</button>
            <a href="index.html" class="btn btn-link">← Volver al menú</a>
        </form>

        <div id="resultado"></div>
    </main>

    <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxpYRNTRTROKznUfepJqJdvVQnLDx2K8TVret7AIUokaE6AEr4_Vxw0gH9AkTeuYe8m/exec";

    function escapar(texto) {
        if (!texto) return "";
        return String(texto).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function llamarAPI(accion, parametros = {}) {
        return new Promise((resolve, reject) => {
            const callbackName = "jsonp_cb_" + Math.random().toString(36).substring(2, 15);
            const urlParams = new URLSearchParams({ action: accion, callback: callbackName, ...parametros });

            const script = document.createElement("script");
            script.src = `${APPS_SCRIPT_URL}?${urlParams.toString()}`;

            window[callbackName] = function (respuesta) {
                cleanup();
                if (respuesta && respuesta.success) {
                    resolve(respuesta);
                } else {
                    reject(new Error(respuesta?.message || "Error al consultar el folio."));
                }
            };

            script.onerror = function () {
                cleanup();
                reject(new Error("Error de conexión con el servidor."));
            };

            function cleanup() {
                delete window[callbackName];
                if (script.parentNode) script.parentNode.removeChild(script);
            }

            document.body.appendChild(script);
        });
    }

    // Cargar folio automáticamente si viene por URL (ej. consulta.html?folio=LCDLF-XXXX)
    window.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const folioUrl = urlParams.get("folio");
        if (folioUrl) {
            document.getElementById("folio").value = folioUrl;
            document.getElementById("formConsulta").requestSubmit();
        }
    });

    document.getElementById("formConsulta")?.addEventListener("submit", async function (e) {
        e.preventDefault();

        const folioInput = document.getElementById("folio");
        const contenedorResultado = document.getElementById("resultado");
        const submitBtn = e.target.querySelector('button[type="submit"]');

        const folio = folioInput.value.trim();
        if (!folio) return;

        try {
            submitBtn.disabled = true;
            contenedorResultado.innerHTML = `<p style="color: #cbd5e1;">Buscando folio en la base de datos...</p>`;

            const respuesta = await llamarAPI("consultarFolio", { folio });
            const datos = respuesta.datos;

            let estadoHtml = "";

            if (datos.estado === "Aceptado") {
                estadoHtml = `
                    <div class="result-card">
                        <span class="selected-badge">¡SELECCIONADO! 👑</span>
                        <h2>¡Felicidades, ${escapar(datos.nombre)}!</h2>
                        <p>Has sido seleccionado para ingresar a <strong>La Casa de los Famosos Roblox</strong>.</p>
                        <p style="margin-top:10px;"><strong>Usuario Roblox:</strong> <code>${escapar(datos.roblox)}</code></p>
                        <p><strong>Folio:</strong> <code>${escapar(datos.folio)}</code></p>
                    </div>
                `;
            } else if (datos.estado === "Rechazado") {
                estadoHtml = `
                    <div class="message error">
                        <h3>Solicitud No Seleccionada ❌</h3>
                        <p>Gracias por tu interés, <strong>${escapar(datos.nombre)}</strong>. Desafortunadamente no fuiste seleccionado en esta ocasión.</p>
                    </div>
                `;
            } else {
                estadoHtml = `
                    <div class="message pending">
                        <h3>Solicitud En Revisión ⏳</h3>
                        <p>Hola <strong>${escapar(datos.nombre)}</strong>, tu solicitud con folio <code>${escapar(datos.folio)}</code> continúa en proceso de evaluación por el equipo de producción.</p>
                    </div>
                `;
            }

            contenedorResultado.innerHTML = estadoHtml;

        } catch (error) {
            contenedorResultado.innerHTML = `
                <div class="message error">
                    <p>${escapar(error.message)}</p>
                </div>
            `;
        } finally {
            submitBtn.disabled = false;
        }
    });
    </script>
</body>
</html>
