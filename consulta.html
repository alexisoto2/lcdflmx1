<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consultar Folio | La Casa de los Famosos Roblox</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{

    min-height:100vh;

    padding:20px 15px;

    color:#fff;

    background:
        radial-gradient(circle at 10% 10%,rgba(0,220,255,.75),transparent 30%),
        radial-gradient(circle at 90% 10%,rgba(170,80,255,.75),transparent 32%),
        radial-gradient(circle at 50% 90%,rgba(255,150,220,.65),transparent 38%),
        linear-gradient(135deg,#063d50,#292b88 48%,#7337a7);

    background-attachment:fixed;

    display:flex;
    justify-content:center;
    align-items:center;

}

body::before{

    content:"";

    position:fixed;

    width:420px;
    height:420px;

    top:-170px;
    left:-130px;

    border-radius:50%;

    background:rgba(65,225,255,.35);

    filter:blur(90px);

    pointer-events:none;

}

body::after{

    content:"";

    position:fixed;

    width:520px;
    height:520px;

    right:-200px;
    bottom:-220px;

    border-radius:50%;

    background:rgba(226,135,255,.35);

    filter:blur(90px);

    pointer-events:none;

}

.container{

    width:100%;
    max-width:570px;

    padding:30px 25px 35px;

    text-align:center;

    background:rgba(255,255,255,.11);

    border:1px solid rgba(255,255,255,.28);

    border-radius:32px;

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    box-shadow:
        0 25px 70px rgba(0,0,0,.38),
        inset 0 1px 2px rgba(255,255,255,.35);

}

.logo-box{

    width:min(390px,100%);

    min-height:145px;

    margin:0 auto 20px;

    display:flex;

    justify-content:center;
    align-items:center;

    padding:12px;

    border-radius:28px;

    background:rgba(255,255,255,.10);

    border:1px solid rgba(255,255,255,.25);

    box-shadow:
        0 15px 40px rgba(0,0,0,.25),
        inset 0 1px 2px rgba(255,255,255,.3);

}

.logo-img{

    width:100%;
    max-width:350px;
    max-height:155px;

    object-fit:contain;

    filter:
        drop-shadow(0 10px 12px rgba(0,0,0,.35))
        drop-shadow(0 0 25px rgba(0,190,255,.35));

}

h1{

    font-size:clamp(1.6rem,5vw,2.2rem);

    font-weight:1000;

    text-transform:uppercase;

    letter-spacing:1.5px;

    margin-bottom:8px;

    text-shadow:
        0 3px 0 #1556c5,
        0 7px 15px rgba(0,0,0,.45);

}

.subtitle{

    color:rgba(255,255,255,.75);

    font-size:.9rem;

    line-height:1.5;

    margin-bottom:20px;

}

.tag{

    display:inline-block;

    margin-bottom:22px;

    padding:6px 14px;

    border-radius:30px;

    background:rgba(255,255,255,.12);

    border:1px solid rgba(255,255,255,.22);

    color:#dff8ff;

    font-size:.7rem;

    font-weight:900;

    letter-spacing:1px;

    text-transform:uppercase;

}

.form-card{

    padding:22px 20px;

    border-radius:22px;

    background:rgba(255,255,255,.07);

    border:1px solid rgba(255,255,255,.16);

}

.form-group{

    margin-bottom:18px;

    text-align:left;

}

label{

    display:block;

    margin-bottom:8px;

    font-size:.84rem;

    font-weight:700;

    color:rgba(255,255,255,.88);

}

input{

    width:100%;

    padding:15px;

    border-radius:14px;

    border:1px solid rgba(255,255,255,.22);

    background:rgba(5,15,45,.35);

    color:white;

    font-size:1rem;

    outline:none;

    text-align:center;

    letter-spacing:1.5px;

    text-transform:uppercase;

}

input:focus{

    border-color:#55dfff;

    box-shadow:0 0 0 3px rgba(85,223,255,.1);

}

.btn{

    display:block;

    width:100%;

    padding:14px 18px;

    border-radius:14px;

    border:none;

    font-size:.92rem;

    font-weight:900;

    text-decoration:none;

    cursor:pointer;

    text-align:center;

}

.btn-primary{

    color:white;

    background:
        linear-gradient(
            135deg,
            #078fff,
            #513cff,
            #a53dff
        );

    box-shadow:
        0 8px 25px rgba(47,102,255,.4);

}

.btn-primary:disabled{

    opacity:.6;

    cursor:wait;

}

.btn-link{

    margin-top:10px;

    color:rgba(255,255,255,.7);

    background:rgba(255,255,255,.05);

    border:1px solid rgba(255,255,255,.12);

}

#resultado{

    margin-top:22px;

}

.loading{

    padding:20px;

    border-radius:18px;

    background:rgba(255,255,255,.07);

    border:1px solid rgba(255,255,255,.15);

}

.spinner{

    width:28px;
    height:28px;

    margin:0 auto 12px;

    border:3px solid rgba(255,255,255,.2);

    border-top-color:#55dcff;

    border-radius:50%;

    animation:giro .8s linear infinite;

}

@keyframes giro{

    to{
        transform:rotate(360deg);
    }

}

.result-card,
.message{

    padding:22px;

    border-radius:20px;

    text-align:left;

    animation:entrada .3s ease;

}

.result-card{

    background:
        linear-gradient(
            135deg,
            rgba(16,185,129,.2),
            rgba(0,200,255,.1)
        );

    border:1px solid rgba(52,211,153,.7);

}

.message.pending{

    background:rgba(245,158,11,.17);

    border:1px solid rgba(245,158,11,.7);

}

.message.error{

    background:rgba(239,68,68,.17);

    border:1px solid rgba(239,68,68,.7);

}

.icon{

    font-size:2.8rem;

    text-align:center;

    margin-bottom:10px;

}

.badge{

    display:block;

    width:max-content;

    margin:0 auto 12px;

    padding:6px 12px;

    border-radius:20px;

    background:rgba(16,185,129,.25);

    color:#6ee7b7;

    font-size:.72rem;

    font-weight:900;

}

.result-card h2,
.message h3{

    color:white;

    font-size:1.25rem;

    margin-bottom:10px;

}

.result-card p,
.message p{

    color:rgba(255,255,255,.8);

    font-size:.88rem;

    line-height:1.55;

    margin-bottom:10px;

}

.dato{

    margin-top:10px;

    padding:10px;

    border-radius:10px;

    background:rgba(0,0,0,.18);

}

.dato strong{

    display:block;

    margin-bottom:4px;

    color:white;

}

code{

    color:#65ddff;

    word-break:break-word;

    font-family:monospace;

}

@keyframes entrada{

    from{

        opacity:0;
        transform:translateY(8px);

    }

    to{

        opacity:1;
        transform:translateY(0);

    }

}

footer{

    margin-top:25px;

    color:rgba(255,255,255,.4);

    font-size:.7rem;

}

@media(max-width:600px){

    body{

        padding:12px;

    }

    .container{

        padding:23px 17px 28px;

        border-radius:27px;

    }

    .logo-box{

        min-height:130px;

    }

}

</style>
</head>


<body>

<main class="container">


    <!-- LOGO -->

    <div class="logo-box">

        <img
            src="logo.png"
            alt="La Casa de los Famosos Roblox"
            class="logo-img"
        >

    </div>


    <!-- ENCABEZADO -->

    <h1>
        Consultar Folio
    </h1>

    <p class="subtitle">

        Consulta el estado de tu postulación
        a La Casa de los Famosos Roblox.

    </p>

    <span class="tag">
        🔍 CONSULTA DE SOLICITUD
    </span>


    <!-- FORMULARIO -->

    <div class="form-card">

        <form id="formConsulta">

            <div class="form-group">

                <label for="folio">

                    Ingresa tu folio:

                </label>

                <input
                    type="text"
                    id="folio"
                    placeholder="LCDLF-XXXX"
                    autocomplete="off"
                    required
                >

            </div>


            <button
                type="submit"
                id="btnBuscar"
                class="btn btn-primary"
            >

                🔍 BUSCAR ESTADO

            </button>


            <a
                href="index.html"
                class="btn btn-link"
            >

                ← Volver al menú

            </a>

        </form>

    </div>


    <!-- RESULTADO -->

    <div id="resultado"></div>


    <footer>

        © 2026 La Casa de los Famosos Roblox

    </footer>


</main>


<script>

/* =====================================================
   TU APPS SCRIPT
===================================================== */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxpYRNTRTROKznUfepJqJdvVQnLDx2K8TVret7AIUokaE6AEr4_Vxw0gH9AkTeuYe8m/exec";


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapar(texto){

    if(texto === null || texto === undefined){

        return "";

    }

    return String(texto)

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   CONSULTAR APPS SCRIPT
===================================================== */

function consultarAPI(folio){

    return new Promise((resolve,reject)=>{

        const callbackName =
            "callback_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2);


        const script =
            document.createElement("script");


        const url =
            APPS_SCRIPT_URL +
            "?action=consultarFolio" +
            "&folio=" +
            encodeURIComponent(folio) +
            "&callback=" +
            encodeURIComponent(callbackName);


        let terminado = false;


        const limpiar = () => {

            if(terminado) return;

            terminado = true;

            delete window[callbackName];

            if(script.parentNode){

                script.parentNode.removeChild(script);

            }

        };


        window[callbackName] = function(respuesta){

            limpiar();

            if(
                respuesta &&
                respuesta.success === true
            ){

                resolve(respuesta);

            }else{

                reject(
                    new Error(
                        respuesta?.message ||
                        "No se encontró información."
                    )
                );

            }

        };


        script.onerror = function(){

            limpiar();

            reject(
                new Error(
                    "No se pudo conectar con Google Apps Script."
                )
            );

        };


        script.src = url;


        document.body.appendChild(script);


        /*
           Si después de 15 segundos no responde,
           mostramos error.
        */

        setTimeout(()=>{

            if(!terminado){

                limpiar();

                reject(
                    new Error(
                        "El servidor tardó demasiado en responder."
                    )
                );

            }

        },15000);

    });

}


/* =====================================================
   MOSTRAR RESULTADO
===================================================== */

function mostrarResultado(datos){

    const resultado =
        document.getElementById("resultado");


    const estado =
        String(datos.estado || "Pendiente")
            .trim()
            .toLowerCase();


    /* =================================================
       ACEPTADO
    ================================================= */

    if(
        estado === "aceptado" ||
        estado === "aceptada" ||
        estado === "seleccionado" ||
        estado === "seleccionada"
    ){

        resultado.innerHTML = `

            <div class="result-card">

                <div class="icon">
                    👑
                </div>

                <span class="badge">
                    ✓ ¡SELECCIONADO!
                </span>

                <h2>
                    ¡Felicidades, ${escapar(datos.nombre)}!
                </h2>

                <p>

                    Has sido seleccionado para ingresar a
                    <strong>
                        La Casa de los Famosos Roblox
                    </strong>.

                </p>


                <div class="dato">

                    <strong>
                        🎮 Usuario Roblox
                    </strong>

                    <code>
                        ${escapar(datos.roblox)}
                    </code>

                </div>


                <div class="dato">

                    <strong>
                        📧 Correo
                    </strong>

                    <code>
                        ${escapar(datos.correo)}
                    </code>

                </div>


                <div class="dato">

                    <strong>
                        🏢 Correo Institucional
                    </strong>

                    <code>
                        ${escapar(datos.correoInstitucional)}
                    </code>

                </div>


                <div class="dato">

                    <strong>
                        🔐 Contraseña
                    </strong>

                    <code>
                        ${escapar(datos.contraseña)}
                    </code>

                </div>


                <div class="dato">

                    <strong>
                        📱 WhatsApp
                    </strong>

                    <code>
                        ${escapar(datos.whatsapp)}
                    </code>

                </div>


                <div class="dato">

                    <strong>
                        💬 Discord
                    </strong>

                    <code>
                        ${escapar(datos.discord)}
                    </code>

                </div>


                <div class="dato">

                    <strong>
                        🏠 Habitación
                    </strong>

                    <code>
                        ${escapar(datos.habitacion)}
                    </code>

                </div>


                <div class="dato">

                    <strong>
                        🎫 Folio
                    </strong>

                    <code>
                        ${escapar(datos.folio)}
                    </code>

                </div>

            </div>

        `;

        return;

    }


    /* =================================================
       RECHAZADO
    ================================================= */

    if(
        estado === "rechazado" ||
        estado === "rechazada" ||
        estado === "no seleccionado" ||
        estado === "no seleccionada"
    ){

        resultado.innerHTML = `

            <div class="message error">

                <div class="icon">
                    😔
                </div>

                <h3>
                    Solicitud no seleccionada
                </h3>

                <p>

                    Gracias por tu interés,
                    <strong>
                        ${escapar(datos.nombre)}
                    </strong>.

                </p>

                <p>

                    Desafortunadamente no fuiste
                    seleccionado en esta ocasión.

                </p>

            </div>

        `;

        return;

    }


    /* =================================================
       PENDIENTE
    ================================================= */

    resultado.innerHTML = `

        <div class="message pending">

            <div class="icon">
                ⏳
            </div>

            <h3>
                Solicitud en revisión
            </h3>

            <p>

                Hola
                <strong>
                    ${escapar(datos.nombre)}
                </strong>.

            </p>

            <p>

                Tu solicitud con folio

                <code>
                    ${escapar(datos.folio)}
                </code>

                continúa en proceso de evaluación.

            </p>

        </div>

    `;

}


/* =====================================================
   FORMULARIO
===================================================== */

document
    .getElementById("formConsulta")
    .addEventListener("submit",async function(e){

        e.preventDefault();


        const folioInput =
            document.getElementById("folio");


        const btn =
            document.getElementById("btnBuscar");


        const resultado =
            document.getElementById("resultado");


        const folio =
            folioInput.value
                .trim()
                .toUpperCase();


        if(!folio){

            return;

        }


        btn.disabled = true;


        resultado.innerHTML = `

            <div class="loading">

                <div class="spinner"></div>

                Consultando Google Sheets...

            </div>

        `;


        try{

            const respuesta =
                await consultarAPI(folio);


            if(
                !respuesta ||
                !respuesta.datos
            ){

                throw new Error(
                    "Google Apps Script no devolvió los datos."
                );

            }


            mostrarResultado(
                respuesta.datos
            );


        }catch(error){

            resultado.innerHTML = `

                <div class="message error">

                    <div class="icon">
                        ⚠️
                    </div>

                    <h3>
                        No se pudo consultar
                    </h3>

                    <p>
                        ${escapar(error.message)}
                    </p>

                    <p style="margin-top:12px;font-size:.75rem;">

                        Verifica que el folio exista
                        y que Apps Script esté publicado
                        como "Cualquier usuario".

                    </p>

                </div>

            `;

        }finally{

            btn.disabled = false;

        }

    });


/* =====================================================
   CONSULTA AUTOMÁTICA
   consulta.html?folio=LCDLF-XXXX
===================================================== */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        const params =
            new URLSearchParams(
                window.location.search
            );


        const folio =
            params.get("folio");


        if(folio){

            document
                .getElementById("folio")
                .value =
                    folio.toUpperCase();


            document
                .getElementById("formConsulta")
                .requestSubmit();

        }

    }
);

</script>

</body>
</html>
