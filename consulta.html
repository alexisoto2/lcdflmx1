<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consultar Folio | La Casa de los Famosos Roblox</title>

<style>
/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    padding:20px;
    font-family:"Segoe UI",Arial,sans-serif;
    color:#fff;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(circle at 15% 15%,rgba(255,92,174,.30),transparent 30%),
        radial-gradient(circle at 85% 10%,rgba(142,92,255,.30),transparent 30%),
        radial-gradient(circle at 50% 100%,rgba(255,180,220,.20),transparent 38%),
        linear-gradient(135deg,#140c22 0%,#261433 45%,#40184c 100%);

    background-attachment:fixed;
    overflow-x:hidden;
}

/* =====================================================
   EFECTOS DEL FONDO
===================================================== */

body::before,
body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    pointer-events:none;
    z-index:-1;
}

body::before{
    width:420px;
    height:420px;
    top:-180px;
    left:-160px;
    background:rgba(255,91,180,.22);
    filter:blur(100px);
}

body::after{
    width:500px;
    height:500px;
    right:-200px;
    bottom:-220px;
    background:rgba(170,90,255,.25);
    filter:blur(110px);
}

/* =====================================================
   CONTENEDOR PRINCIPAL
===================================================== */

.container{
    width:100%;
    max-width:560px;
    padding:30px;

    text-align:center;

    background:rgba(255,255,255,.075);

    border:1px solid rgba(255,255,255,.18);

    border-radius:30px;

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    box-shadow:
        0 30px 80px rgba(0,0,0,.45),
        inset 0 1px 1px rgba(255,255,255,.18);

    animation:aparecer .55s ease;
}

/* =====================================================
   LOGO
===================================================== */

.logo-box{
    width:100%;
    max-width:380px;
    min-height:130px;

    margin:0 auto 24px;

    padding:15px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:24px;

    background:rgba(255,255,255,.07);

    border:1px solid rgba(255,255,255,.15);

    box-shadow:
        0 15px 35px rgba(0,0,0,.25),
        inset 0 1px 1px rgba(255,255,255,.15);
}

.logo-img{
    display:block;

    width:100%;
    max-width:330px;
    max-height:140px;

    object-fit:contain;

    filter:
        drop-shadow(0 8px 12px rgba(0,0,0,.40))
        drop-shadow(0 0 20px rgba(255,100,190,.18));
}

/* =====================================================
   TITULO
===================================================== */

h1{
    margin-bottom:8px;

    font-size:clamp(1.7rem,6vw,2.25rem);

    line-height:1.1;

    font-weight:900;

    text-transform:uppercase;

    letter-spacing:1px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #ffd6ef,
            #ffffff
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    text-shadow:
        0 5px 20px rgba(255,100,190,.20);
}

.subtitle{
    max-width:430px;

    margin:0 auto 18px;

    color:rgba(255,255,255,.68);

    font-size:.9rem;

    line-height:1.55;
}

/* =====================================================
   ETIQUETA
===================================================== */

.tag{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    margin-bottom:22px;

    padding:7px 14px;

    border-radius:50px;

    background:rgba(255,255,255,.07);

    border:1px solid rgba(255,255,255,.14);

    color:#ffd8ef;

    font-size:.68rem;

    font-weight:800;

    letter-spacing:1px;

    text-transform:uppercase;

    box-shadow:
        0 5px 20px rgba(0,0,0,.15);
}

/* =====================================================
   FORMULARIO
===================================================== */

.form-card{
    padding:22px;

    border-radius:22px;

    background:rgba(0,0,0,.12);

    border:1px solid rgba(255,255,255,.12);
}

.form-group{
    margin-bottom:16px;

    text-align:left;
}

label{
    display:block;

    margin-bottom:8px;

    color:rgba(255,255,255,.86);

    font-size:.82rem;

    font-weight:700;
}

input{
    width:100%;

    height:54px;

    padding:0 16px;

    border-radius:15px;

    border:1px solid rgba(255,255,255,.16);

    outline:none;

    background:rgba(0,0,0,.20);

    color:#fff;

    font-family:inherit;

    font-size:1rem;

    font-weight:700;

    text-align:center;

    letter-spacing:1.5px;

    text-transform:uppercase;

    transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
}

input::placeholder{
    color:rgba(255,255,255,.35);
}

input:focus{
    background:rgba(0,0,0,.28);

    border-color:#ff70bd;

    box-shadow:
        0 0 0 3px rgba(255,112,189,.10),
        0 0 25px rgba(255,112,189,.08);
}

/* =====================================================
   BOTONES
===================================================== */

.btn{
    width:100%;

    min-height:52px;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:13px 18px;

    border-radius:15px;

    font-family:inherit;

    font-size:.85rem;

    font-weight:900;

    text-decoration:none;

    cursor:pointer;

    transition:
        transform .2s ease,
        filter .2s ease,
        box-shadow .2s ease;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn:active{
    transform:translateY(0);
}

.btn-primary{
    border:none;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #ff4fae,
            #c73cff,
            #8d4dff
        );

    box-shadow:
        0 10px 28px rgba(207,60,255,.28);
}

.btn-primary:hover{
    filter:brightness(1.08);

    box-shadow:
        0 13px 32px rgba(207,60,255,.38);
}

.btn-primary:disabled{
    opacity:.55;

    cursor:wait;

    transform:none;
}

.btn-link{
    margin-top:10px;

    color:rgba(255,255,255,.70);

    background:rgba(255,255,255,.045);

    border:1px solid rgba(255,255,255,.12);
}

.btn-link:hover{
    color:#fff;

    background:rgba(255,255,255,.08);
}

/* =====================================================
   RESULTADO
===================================================== */

#resultado{
    margin-top:20px;
}

.loading,
.result-card,
.message{
    width:100%;

    padding:22px;

    border-radius:20px;

    animation:entrada .3s ease;
}

/* =====================================================
   LOADING
===================================================== */

.loading{
    background:rgba(255,255,255,.055);

    border:1px solid rgba(255,255,255,.12);

    color:rgba(255,255,255,.75);

    font-size:.85rem;
}

.spinner{
    width:30px;
    height:30px;

    margin:0 auto 12px;

    border:3px solid rgba(255,255,255,.16);

    border-top-color:#ff68b9;

    border-right-color:#a74dff;

    border-radius:50%;

    animation:giro .8s linear infinite;
}

@keyframes giro{
    to{
        transform:rotate(360deg);
    }
}

/* =====================================================
   RESULTADO ACEPTADO
===================================================== */

.result-card{
    text-align:left;

    background:
        linear-gradient(
            135deg,
            rgba(16,185,129,.15),
            rgba(255,255,255,.055)
        );

    border:1px solid rgba(52,211,153,.45);

    box-shadow:
        0 10px 35px rgba(0,0,0,.15);
}

.result-card .icon{
    text-align:center;
}

.badge{
    display:block;

    width:max-content;

    margin:0 auto 13px;

    padding:7px 13px;

    border-radius:50px;

    background:rgba(16,185,129,.15);

    border:1px solid rgba(52,211,153,.25);

    color:#6ee7b7;

    font-size:.68rem;

    font-weight:900;

    letter-spacing:.7px;
}

.result-card h2,
.message h3{
    margin-bottom:10px;

    color:#fff;

    font-size:1.18rem;

    line-height:1.3;
}

.result-card p,
.message p{
    margin-bottom:10px;

    color:rgba(255,255,255,.72);

    font-size:.85rem;

    line-height:1.55;
}

.result-card strong,
.message strong{
    color:#fff;
}

/* =====================================================
   DATOS
===================================================== */

.dato{
    margin-top:9px;

    padding:11px 12px;

    border-radius:12px;

    background:rgba(0,0,0,.17);

    border:1px solid rgba(255,255,255,.06);

    overflow:hidden;
}

.dato strong{
    display:block;

    margin-bottom:5px;

    font-size:.75rem;

    color:rgba(255,255,255,.72);
}

code{
    display:block;

    color:#ffb7dd;

    font-family:monospace;

    font-size:.82rem;

    line-height:1.45;

    word-break:break-word;
}

/* =====================================================
   MENSAJES
===================================================== */

.message{
    text-align:center;
}

.message.pending{
    background:rgba(245,158,11,.10);

    border:1px solid rgba(245,158,11,.45);
}

.message.error{
    background:rgba(239,68,68,.10);

    border:1px solid rgba(239,68,68,.45);
}

.message code{
    display:inline;

    font-size:.8rem;
}

/* =====================================================
   ICONOS
===================================================== */

.icon{
    margin-bottom:10px;

    font-size:2.5rem;

    line-height:1;
}

/* =====================================================
   FOOTER
===================================================== */

footer{
    margin-top:22px;

    color:rgba(255,255,255,.32);

    font-size:.68rem;

    line-height:1.5;
}

/* =====================================================
   ANIMACIONES
===================================================== */

@keyframes aparecer{
    from{
        opacity:0;
        transform:translateY(15px) scale(.98);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes entrada{
    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =====================================================
   CELULAR
===================================================== */

@media(max-width:600px){

    body{
        min-height:100svh;

        padding:12px;

        align-items:flex-start;
    }

    .container{
        margin:8px 0;

        padding:22px 15px 24px;

        border-radius:24px;
    }

    .logo-box{
        min-height:105px;

        margin-bottom:20px;

        padding:10px;

        border-radius:20px;
    }

    .logo-img{
        max-height:105px;
    }

    h1{
        font-size:1.65rem;

        letter-spacing:.7px;
    }

    .subtitle{
        font-size:.82rem;

        margin-bottom:15px;
    }

    .tag{
        margin-bottom:18px;

        padding:6px 11px;

        font-size:.61rem;
    }

    .form-card{
        padding:17px 14px;

        border-radius:18px;
    }

    input{
        height:51px;

        font-size:.92rem;
    }

    .btn{
        min-height:50px;

        font-size:.8rem;
    }

    .loading,
    .result-card,
    .message{
        padding:18px 15px;

        border-radius:17px;
    }

    .result-card h2,
    .message h3{
        font-size:1.05rem;
    }

    .result-card p,
    .message p{
        font-size:.82rem;
    }

    .dato{
        padding:10px;
    }

    code{
        font-size:.76rem;
    }

    footer{
        margin-top:18px;
    }
}

/* =====================================================
   PANTALLAS MUY PEQUEÑAS
===================================================== */

@media(max-width:360px){

    body{
        padding:8px;
    }

    .container{
        padding:18px 11px 20px;
    }

    .logo-box{
        min-height:90px;
    }

    h1{
        font-size:1.45rem;
    }

    .form-card{
        padding:14px 11px;
    }
}
</style>
</head>

<body>

<main class="container">

    <!-- =================================================
         LOGO
    ================================================== -->

    <div class="logo-box">

        <img
            src="logo.png"
            alt="La Casa de los Famosos Roblox"
            class="logo-img"
        >

    </div>


    <!-- =================================================
         ENCABEZADO
    ================================================== -->

    <h1>
        Consultar Folio
    </h1>

    <p class="subtitle">
        Consulta el estado de tu postulación
        a La Casa de los Famosos Roblox.
    </p>

    <span class="tag">
        🔎 CONSULTA DE SOLICITUD
    </span>


    <!-- =================================================
         FORMULARIO
    ================================================== -->

    <div class="form-card">

        <form id="formConsulta">

            <div class="form-group">

                <label for="folio">
                    Ingresa tu folio
                </label>

                <input
                    type="text"
                    id="folio"
                    placeholder="LCDLF-XXXX"
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false"
                    required
                >

            </div>

            <button
                type="submit"
                id="btnBuscar"
                class="btn btn-primary"
            >
                🔍 BUSCAR ESTADO
            </button>

            <a
                href="index.html"
                class="btn btn-link"
            >
                ← Volver al menú
            </a>

        </form>

    </div>


    <!-- =================================================
         RESULTADO
    ================================================== -->

    <div id="resultado"></div>


    <!-- =================================================
         FOOTER
    ================================================== -->

    <footer>
        © 2026 La Casa de los Famosos Roblox
    </footer>

</main>


<script>

/* =====================================================
   TU APPS SCRIPT
   NO CAMBIAR
===================================================== */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxpYRNTRTROKznUfepJqJdvVQnLDx2K8TVret7AIUokaE6AEr4_Vxw0gH9AkTeuYe8m/exec";


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapar(texto){

    if(texto === null || texto === undefined){
        return "";
    }

    return String(texto)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =====================================================
   CONSULTAR APPS SCRIPT
===================================================== */

function consultarAPI(folio){

    return new Promise((resolve,reject)=>{

        const callbackName =
            "callback_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2);

        const script =
            document.createElement("script");

        const url =
            APPS_SCRIPT_URL +
            "?action=consultarFolio" +
            "&folio=" +
            encodeURIComponent(folio) +
            "&callback=" +
            encodeURIComponent(callbackName);

        let terminado = false;


        const limpiar = () => {

            if(terminado) return;

            terminado = true;

            delete window[callbackName];

            if(script.parentNode){
                script.parentNode.removeChild(script);
            }
        };


        window[callbackName] = function(respuesta){

            limpiar();

            if(
                respuesta &&
                respuesta.success === true
            ){

                resolve(respuesta);

            }else{

                reject(
                    new Error(
                        respuesta?.message ||
                        "No se encontró información."
                    )
                );

            }

        };


        script.onerror = function(){

            limpiar();

            reject(
                new Error(
                    "No se pudo conectar con la Base de Datos."
                )
            );

        };


        script.src = url;

        document.body.appendChild(script);


        setTimeout(()=>{

            if(!terminado){

                limpiar();

                reject(
                    new Error(
                        "El servidor tardó demasiado en responder."
                    )
                );

            }

        },15000);

    });

}


/* =====================================================
   MOSTRAR RESULTADO
===================================================== */

function mostrarResultado(datos){

    const resultado =
        document.getElementById("resultado");

    const estado =
        String(datos.estado || "Pendiente")
            .trim()
            .toLowerCase();


    /* =================================================
       ACEPTADO
    ================================================= */

    if(
        estado === "aceptado" ||
        estado === "aceptada" ||
        estado === "seleccionado" ||
        estado === "seleccionada"
    ){

        resultado.innerHTML = `

            <div class="result-card">

                <div class="icon">
                    👑
                </div>

                <span class="badge">
                    ✓ ¡SELECCIONADO!
                </span>

                <h2>
                    ¡Felicidades, ${escapar(datos.nombre)}!
                </h2>

                <p>
                    Has sido seleccionado para ingresar a
                    <strong>
                        La Casa de los Famosos Roblox
                    </strong>.
                </p>

                <div class="dato">

                    <strong>
                        🎮 Usuario Roblox
                    </strong>

                    <code>
                        ${escapar(datos.roblox)}
                    </code>

                </div>

                <div class="dato">

                    <strong>
                        📧 Correo
                    </strong>

                    <code>
                        ${escapar(datos.correo)}
                    </code>

                </div>

                <div class="dato">

                    <strong>
                        🏢 Correo Institucional
                    </strong>

                    <code>
                        ${escapar(datos.correoLCDLF)}
                    </code>

                </div>

                <div class="dato">

                    <strong>
                        🔐 Contraseña
                    </strong>

                    <code>
                        ${escapar(datos.contraseña)}
                    </code>

                </div>

                <div class="dato">

                    <strong>
                        📱 WhatsApp
                    </strong>

                    <code>
                        ${escapar(datos.whatsapp)}
                    </code>

                </div>

                <div class="dato">

                    <strong>
                        💬 Discord
                    </strong>

                    <code>
                        ${escapar(datos.discord)}
                    </code>

                </div>

                <div class="dato">

                    <strong>
                        🏠 Habitación
                    </strong>

                    <code>
                        ${escapar(datos.habitacion)}
                    </code>

                </div>

                <div class="dato">

                    <strong>
                        🎫 Folio
                    </strong>

                    <code>
                        ${escapar(datos.folio)}
                    </code>

                </div>

            </div>

        `;

        return;
    }


    /* =================================================
       RECHAZADO
    ================================================= */

    if(
        estado === "rechazado" ||
        estado === "rechazada" ||
        estado === "no seleccionado" ||
        estado === "no seleccionada"
    ){

        resultado.innerHTML = `

            <div class="message error">

                <div class="icon">
                    😔
                </div>

                <h3>
                    Solicitud no seleccionada
                </h3>

                <p>
                    Gracias por tu interés,
                    <strong>
                        ${escapar(datos.nombre)}
                    </strong>.
                </p>

                <p>
                    Desafortunadamente no fuiste
                    seleccionado en esta ocasión.
                </p>

            </div>

        `;

        return;
    }


    /* =================================================
       PENDIENTE
    ================================================= */

    resultado.innerHTML = `

        <div class="message pending">

            <div class="icon">
                ⏳
            </div>

            <h3>
                Solicitud en revisión
            </h3>

            <p>
                Hola
                <strong>
                    ${escapar(datos.nombre)}
                </strong>.
            </p>

            <p>

                Tu solicitud con folio

                <code>
                    ${escapar(datos.folio)}
                </code>

                continúa en proceso de evaluación.

            </p>

        </div>

    `;
}


/* =====================================================
   FORMULARIO
===================================================== */

document
    .getElementById("formConsulta")
    .addEventListener(
        "submit",
        async function(e){

            e.preventDefault();

            const folioInput =
                document.getElementById("folio");

            const btn =
                document.getElementById("btnBuscar");

            const resultado =
                document.getElementById("resultado");

            const folio =
                folioInput.value
                    .trim()
                    .toUpperCase();


            if(!folio){
                return;
            }


            btn.disabled = true;

            resultado.innerHTML = `

                <div class="loading">

                    <div class="spinner"></div>

                    Consultando Google Sheets...

                </div>

            `;


            try{

                const respuesta =
                    await consultarAPI(folio);


                if(
                    !respuesta ||
                    !respuesta.datos
                ){

                    throw new Error(
                        "Google Apps Script no devolvió los datos."
                    );

                }


                mostrarResultado(
                    respuesta.datos
                );


            }catch(error){

                resultado.innerHTML = `

                    <div class="message error">

                        <div class="icon">
                            ⚠️
                        </div>

                        <h3>
                            No se pudo consultar
                        </h3>

                        <p>
                            ${escapar(error.message)}
                        </p>

                        <p style="
                            margin-top:12px;
                            font-size:.73rem;
                        ">

                            Verifica que el folio exista
                            y que Apps Script esté publicado
                            como "Cualquier usuario".

                        </p>

                    </div>

                `;

            }finally{

                btn.disabled = false;

            }

        }
    );


/* =====================================================
   CONSULTA AUTOMÁTICA

   consulta.html?folio=LCDLF-XXXX
===================================================== */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        const params =
            new URLSearchParams(
                window.location.search
            );

        const folio =
            params.get("folio");


        if(folio){

            document
                .getElementById("folio")
                .value =
                    folio.toUpperCase();


            document
                .getElementById("formConsulta")
                .requestSubmit();

        }

    }
);

</script>

</body>
</html>
